}

// Revenue y # ventas de un conjunto de asesores en un día concreto
function revDia(store, ids, mesId, dia) {
  let rev=0, n=0;
  ids.forEach(a=>{ const rows=(getMonthData(store,mesId,a)[String(dia)]||[]); rev+=sumR(rows); n+=rows.length; });
  return {rev,n};
}
// Métricas del mes para un "símbolo" (equipo o asesor)
function bxStats(store, mesId, ids) {
  const mi = getMesInfo(mesId);
  const esActual = mesId===getMesActual();
  const diaHoy = esActual ? Math.min(getDiaHoy(),mi.dias) : mi.dias;
  const dias=[]; let total=0, ventas=0, activos=0, max=null, min=null;
  for (let d=1; d<=mi.dias; d++) {
    const r = revDia(store, ids, mesId, d);
    dias.push(r);
    if (d<=diaHoy) { total+=r.rev; ventas+=r.n; }
    if (r.rev>0) { activos++; if(!max||r.rev>max.rev) max={dia:d,rev:r.rev}; if(!min||r.rev<min.rev) min={dia:d,rev:r.rev}; }
  }
  const cfg = getConfig(store,mesId);
  const factor = ids.length>1 ? 1 : 0.5;              // igual que AdvisorTab: meta individual = meta/2
  const meta = (cfg.metaBase||0)*factor, metaSfly=(cfg.metaSfly||0)*factor;
  const prom = activos>0 ? total/activos : 0;
  const proy = total + prom*Math.max(0,mi.dias-diaHoy);
  const ritmo = meta*diaHoy/mi.dias;
  const acum=[]; let s=0; for(let d=1; d<=diaHoy; d++){ s+=dias[d-1].rev; acum.push(s); }
  return { mi, diaHoy, esActual, dias, total, ventas, activos, max, min, meta, metaSfly, prom, proy, ritmo, acum,
    hoy: dias[diaHoy-1]||{rev:0,n:0}, ayer: diaHoy>1?dias[diaHoy-2]:{rev:0,n:0},
    ticket: ventas>0?total/ventas:0, arriba: total>=ritmo, cfg };
}

function Sparkline({ acum, metaDia, w=92, h=34, color }) {
  const n = Math.max(acum.length,2);
  const ritmoFin = metaDia*acum.length;
  const maxY = Math.max(ritmoFin, ...acum, 1);
  const Yp = v => h-2-(v/maxY)*(h-4);
  const pts = acum.map((v,i)=>[ (i/(n-1))*w, Yp(v) ]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const id = useMemo(()=>"spk"+Math.random().toString(36).slice(2,8),[]);
  return (
    <svg width={w} height={h} style={{display:"block",flexShrink:0}} aria-hidden="true">
      <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={color} stopOpacity="0.35"/><stop offset="1" stopColor={color} stopOpacity="0"/></linearGradient></defs>
      <line x1="0" x2={w} y1={Yp(0)} y2={Yp(ritmoFin)} stroke={BX.txt2} strokeWidth="1" strokeDasharray="2 3" opacity="0.7"/>
      {pts.length>1&&<path d={line+" L"+pts[pts.length-1][0]+","+h+" L0,"+h+" Z"} fill={"url(#"+id+")"} />}
      {pts.length>1&&<path d={line} fill="none" stroke={color} strokeWidth="1.6" strokeLinejoin="round"/>}
    </svg>
  );
}

// ── Gráfica de área con eje a la derecha, grid, referencia punteada y volumen ──
function BolsaChart({ puntos, referencia: refVal, color, alto }) {
  const boxRef = useRef(null);
  const W = useWidth(boxRef);
  const [hover,setHover] = useState(null);
  const H = alto||300, padR = 72, padB = 30, volH = 46, plotW = Math.max(W-padR,50), plotH = H-padB;
  const vals = puntos.map(p=>p.y).filter(v=>v!=null);
  const refs = Array.isArray(refVal) ? refVal.filter(v=>v!=null) : (refVal!=null?[refVal]:[]);
  let lo = Math.min(...vals, ...refs), hi = Math.max(...vals, ...refs, 1);
  if (!isFinite(lo)) lo = 0;
  if (lo>0 && lo<hi*0.35) lo = 0;
  const span = (hi-lo)||1; lo = Math.max(0, lo-span*0.06); hi = hi+span*0.08;
  const X = i => puntos.length<=1 ? plotW/2 : (i/(puntos.length-1))*plotW;
  const Y = v => plotH-8-((v-lo)/(hi-lo))*(plotH-16);
  const idxs = puntos.map((p,i)=>p.y!=null?i:null).filter(i=>i!=null);
  const linea = idxs.map((i,k)=>(k?"L":"M")+X(i).toFixed(1)+","+Y(puntos[i].y).toFixed(1)).join(" ");
  const gid = "bxg"+String(color).replace("#","");
  const ticks = [0,1,2,3].map(k=>lo+(hi-lo)*(0.12+k*0.26));
  const cada = Math.max(1, Math.ceil(puntos.length/(W<500?5:9)));
  const maxN = Math.max(1,...puntos.map(p=>p.n||0));
  const refPath = Array.isArray(refVal)
    ? refVal.map((v,i)=>v==null?"":((i&&refVal[i-1]!=null)?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")
    : (refVal!=null ? "M0,"+Y(refVal).toFixed(1)+" L"+plotW+","+Y(refVal).toFixed(1) : "");
  const mover = (clientX) => {
    const r = boxRef.current.getBoundingClientRect();
    const x = clientX - r.left; if (x<0||x>plotW) { setHover(null); return; }
    let best=null, bd=1e9; idxs.forEach(i=>{ const d=Math.abs(X(i)-x); if(d<bd){bd=d;best=i;} });
    setHover(best);
  };
  const hp = hover!=null ? puntos[hover] : null;
  return (
    <div ref={boxRef} style={{position:"relative",width:"100%",userSelect:"none",touchAction:"pan-y"}}
      onMouseMove={e=>mover(e.clientX)} onMouseLeave={()=>setHover(null)}
      onTouchStart={e=>mover(e.touches[0].clientX)} onTouchMove={e=>mover(e.touches[0].clientX)} onTouchEnd={()=>setHover(null)}>
      <svg width={W} height={H+volH} style={{display:"block",overflow:"visible"}} role="img" aria-label="Gráfica de revenue">
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={color} stopOpacity="0.38"/><stop offset="1" stopColor={color} stopOpacity="0.02"/></linearGradient></defs>
        {ticks.map((t,i)=><g key={i}>
          <line x1="0" x2={plotW} y1={Y(t)} y2={Y(t)} stroke={BX.line} strokeWidth="1"/>
          <text x={plotW+10} y={Y(t)+5} fill={BX.txt} fontSize="14" fontWeight="600" fontFamily={BX.font}>{usdK(t)}</text>
        </g>)}
        {puntos.map((p,i)=>(i%cada===0&&i>0)?<g key={"x"+i}>
          <line x1={X(i)} x2={X(i)} y1="0" y2={plotH} stroke={BX.line2} strokeWidth="1"/>
          <text x={X(i)+5} y={plotH+21} fill={BX.txt} fontSize="13" fontWeight="600" fontFamily={BX.font}>{p.x}</text>
        </g>:null)}
        <line x1="0" x2={plotW} y1={plotH} y2={plotH} stroke={BX.txt3} strokeWidth="1"/>
        {refPath&&<path d={refPath} fill="none" stroke={BX.txt2} strokeWidth="1.2" strokeDasharray="3 4" opacity="0.8"/>}
        {idxs.length>1&&<path d={linea+" L"+X(idxs[idxs.length-1])+","+plotH+" L"+X(idxs[0])+","+plotH+" Z"} fill={"url(#"+gid+")"}/>}
        {idxs.length>1&&<path d={linea} fill="none" stroke={color} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>}
        {idxs.length===1&&<circle cx={X(idxs[0])} cy={Y(puntos[idxs[0]].y)} r="4" fill={color}/>}
        {puntos.map((p,i)=>{ if(!p.n) return null; const bw=Math.min(12,Math.max(2,plotW/puntos.length*0.55)); return <rect key={"v"+i} x={Math.min(Math.max(X(i)-bw/2,0),plotW-bw)} width={bw}
          y={H+volH-4-(p.n/maxN)*(volH-12)} height={(p.n/maxN)*(volH-12)} fill={hover===i?color:BX.txt3} rx="1"/>; })}
        {hp&&<g>
          <line x1={X(hover)} x2={X(hover)} y1="0" y2={H+volH-4} stroke={BX.txt2} strokeWidth="1"/>
          <circle cx={X(hover)} cy={Y(hp.y)} r="5" fill={color} stroke={BX.bg} strokeWidth="2"/>
        </g>}
      </svg>
      {hp&&(
        <div style={{position:"absolute",top:-6,left:Math.min(Math.max(X(hover)-80,0),Math.max(plotW-160,0)),width:160,background:BX.card,border:"1px solid "+BX.line,
          borderRadius:10,padding:"7px 10px",pointerEvents:"none",boxShadow:"0 8px 24px rgba(0,0,0,0.4)"}}>
          <div style={{fontSize:11,color:BX.txt2,fontWeight:600}}>{hp.etiqueta||hp.x}</div>
          <div style={{fontSize:16,fontWeight:700,color:BX.txt,fontVariantNumeric:"tabular-nums"}}>{usd(hp.y)}</div>
          <div style={{fontSize:11,color:BX.txt2}}>{hp.n||0} {hp.n===1?"venta":"ventas"}{hp.nota?" · "+hp.nota:""}</div>
        </div>
      )}
    </div>
  );
}

const BX_PERIODOS = [
  { id:"1D", label:"1 D", t:"Hoy por hora (acumulado)" },
  { id:"1S", label:"1 S", t:"Últimos 7 días" },
  { id:"1M", label:"1 M", t:"Mes acumulado vs. ritmo de meta" },
  { id:"3M", label:"3 M", t:"Últimos 90 días" },
  { id:"YTD",label:"YTD", t:"Año en curso, por mes" },
];
function seriePeriodo(store, ids, mesId, per, st) {
  const mi = st.mi;
  const base = st.esActual ? new Date() : new Date(parseInt(mesId), parseInt(mesId.split("-")[1])-1, mi.dias);
  const metaDia = st.meta/mi.dias;
  if (per==="1M") {
    let s=0; const pts=[], ref=[];
    for (let d=1; d<=mi.dias; d++) {
      const r = st.dias[d-1];
      if (d<=st.diaHoy) s+=r.rev;
      pts.push({ x:String(d), y:d<=st.diaHoy?s:null, n:d<=st.diaHoy?r.n:0, etiqueta:mi.label+" "+d+" ("+dowDia(d,mesId)+")", nota:usd(r.rev,0)+" el día" });
      ref.push(st.meta*d/mi.dias);
    }
    return { pts, ref, refLbl:"Ritmo para meta "+usdK(st.meta) };
  }
  if (per==="1S" || per==="3M") {
    const nd = per==="1S"?7:90, pts=[];
    for (let k=nd-1; k>=0; k--) {
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate()-k);
      const r = revDia(store, ids, fechaToMes(d), d.getDate());
      pts.push({ x: per==="1S" ? DOW[d.getDay()]+" "+d.getDate() : d.getDate()+"/"+(d.getMonth()+1), y:r.rev, n:r.n,
        etiqueta:d.toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"short"}) });
    }
    return { pts, ref:metaDia, refLbl:"Meta diaria "+usdK(metaDia) };
  }
  if (per==="YTD") {
    const pts=[], ref=[]; const yr=mesId.slice(0,4);
    MESES.filter(m=>m.id.slice(0,4)===yr && m.id<=fechaToMes(base)).forEach(m=>{
      let rev=0,n=0; for(let d=1; d<=m.dias; d++){ const r=revDia(store,ids,m.id,d); rev+=r.rev; n+=r.n; }
      const c = getConfig(store,m.id);
      pts.push({ x:m.label.slice(0,3), y:rev, n, etiqueta:m.label });
      ref.push((c.metaBase||0)*(ids.length>1?1:0.5));
    });
    return { pts, ref, refLbl:"Meta mensual" };
  }
  // 1D: acumulado por hora del día (usa la hora de registro de cada venta)
  const mId = fechaToMes(base), dia = base.getDate();
  const porHora = {}; let sinHora=0;
  ids.forEach(a=>(getMonthData(store,mId,a)[String(dia)]||[]).forEach(r=>{
    const t = tsMs(r.ts); if(!t){ sinHora+=parseFloat(r.valor)||0; return; }
    const h = new Date(t).getHours(); porHora[h]=porHora[h]||{rev:0,n:0}; porHora[h].rev+=parseFloat(r.valor)||0; porHora[h].n++;
  }));
  const ahoraH = st.esActual ? new Date().getHours() : 23;
  let s=sinHora; const pts=[];
  for (let h=7; h<=23; h++) {
    const r = porHora[h]||{rev:0,n:0}; s+=r.rev;
    const lbl = (h%12||12)+(h<12?" a.m.":" p.m.");
    pts.push({ x:String(h%12||12), y:h<=ahoraH?s:null, n:r.n, etiqueta:lbl, nota:usd(r.rev,0)+" en la hora" });
  }
  return { pts, ref:metaDia, refLbl:"Meta diaria "+usdK(metaDia) };
}

            style={{all:"unset",cursor:"pointer",flex:"1 0 auto",textAlign:"center",padding:"9px 14px",borderRadius:20,fontSize:17,fontWeight:700,
              color:per===p.id?BX.txt:BX.txt2,background:per===p.id?BX.card:"transparent"}}>{p.label}</button>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,color:BX.txt2,margin:"10px 0 14px",gap:10,flexWrap:"wrap"}}>
        <span>{(BX_PERIODOS.find(p=>p.id===per)||{}).t}</span>
        <span><span style={{letterSpacing:2}}>┄</span> {serie.refLbl}</span>
      </div>
      <BolsaChart puntos={serie.pts} referencia={serie.ref} color={c} alto={isMob?230:330} />

      {/* Ficha de datos */}
      <div className="bx-stats" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",marginTop:22}}>
        {[
          [["Revenue mes",usd(st.total,0)],["Hoy",usd(st.hoy.rev,0)],["Ayer",usd(st.ayer.rev,0)]],
          [["Ventas",String(st.ventas)],["Ticket prom.",usd(st.ticket,0)],["Días activos",st.activos+" / "+st.diaHoy]],
          [["Máx. día",st.max?usd(st.max.rev,0)+" · D"+st.max.dia:"—"],["Mín. día",st.min?usd(st.min.rev,0)+" · D"+st.min.dia:"—"],["Prom./día",usd(st.prom,0)]],
          [["Meta",usd(st.meta,0)],["Cumplido",pct.toFixed(1)+"%", pct>=100?BX.up:undefined],["vs. ritmo",(delta>=0?"+":"")+usd(delta,0), delta>=0?BX.up:BX.down]],
        ].map((col,i)=>(
          <div key={i} className="bx-col" style={{padding:"0 18px",borderLeft:i?"1px solid "+BX.line:"none"}}>
            {col.map(([l,v,cc])=><DatoFila key={l} l={l} v={v} c={cc}/>)}
          </div>
        ))}
      </div>
      {onVerRegistro&&(
        <button onClick={onVerRegistro} style={{all:"unset",cursor:"pointer",marginTop:20,fontSize:18,fontWeight:600,color:BX.blue}}>
          {ids.length>1?"Ver detalle del equipo":"Ir al registro de ventas"} ›
        </button>
      )}

      {/* Actividad reciente (equivalente a las noticias) */}
      {actividad.length>0&&(
        <div style={{marginTop:30}}>
          <div style={{fontSize:13,fontWeight:700,color:BX.txt2,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Actividad reciente</div>
          <div className="bx-news" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",columnGap:40}}>
            {actividad.map(it=>(
              <button key={it.k} onClick={()=>onIr&&it.ir&&onIr(it.ir)} style={{all:"unset",cursor:it.ir?"pointer":"default",display:"block",padding:"16px 0",borderBottom:"1px solid "+BX.line2}}>
                <div style={{fontSize:14,color:it.kc,fontWeight:600,marginBottom:6}}>{it.kicker}</div>
                <div style={{fontSize:19,fontWeight:700,lineHeight:1.3,color:BX.txt}}>{it.titulo}</div>
                <div style={{fontSize:15,color:BX.txt2,marginTop:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.resumen}</div>
                <div style={{fontSize:13,color:BX.txt3,fontWeight:600,marginTop:10}}>{it.cuando}</div>
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Encabezado oscuro para las herramientas (Malla, Tracker, etc.)
function BolsaTitulo({ titulo, sub }) {
  return (
    <div style={{color:BX.txt,fontFamily:BX.font,marginBottom:18}}>
      <h1 className="bx-h1" style={{fontSize:44,fontWeight:800,letterSpacing:"-0.03em",margin:0}}>{titulo}</h1>
      {sub&&<div style={{fontSize:17,color:BX.txt2,marginTop:6}}>{sub}</div>}
    </div>
  );
}

function App() {
  const [tab,    setTab]    = useState("global");
  const [mesId,  setMesId]  = useState(getMesActual);
  const [store,  setStore]  = useState(loadStore);
  const [showPin,setShowPin] = useState(false);
  const [configSource, setConfigSource] = useState("local"); // "remote" | "local"
  const storeRef = useRef(store);
  // Registros duplicados del mes seleccionado (badge en la pestaña Duplicados)
  const dupCount = useMemo(()=>buildDupGroups(store).filter(g=>g.entries.some(x=>x.mesId===mesId)).reduce((s,g)=>s+g.entries.length-1,0),[store,mesId]);

  // ── CARGA INICIAL Y PERIÓDICA DE CONFIG DESDE SHEETS (pestaña Config) ─────────
  useEffect(function() {
    var cancelled = false;
    async function loadConfig() {
      await fetchRemoteConfig();
      if (!cancelled) setConfigSource(_remoteConfigLoaded ? "remote" : "local");
    }
    loadConfig();
    // Refresca la config remota cada 60s (los datos de config cambian poco)
    const id = setInterval(function() {
      _remoteConfigLoading = false; // permitir re-fetch
      loadConfig();
    }, 60000);
    return function() { cancelled = true; clearInterval(id); };
  }, []);
  // -- REAL-TIME POLLING desde Google Sheets (Apps Script) -------------------
  // Cada 10s lee la hoja RealTime, reconstruye el store y lo aplica con setStore.
  useEffect(function() {
    let cancelled = false;
    let lastSig = "";
    const REMOTE_URL = SHEETS_URL + "?accion=read";

    const buildStoreFromRows = function(rows) {
      var prev = storeRef.current || {};
      var next = {};
      // CAMBIO METAS: preservar configs locales mientras llegan las remotas
      if (prev.config) next.config = Object.assign({}, prev.config);
      if (Array.isArray(prev.deleted)) next.deleted = prev.deleted.slice(-200);
      var MES_NUM = {"enero":1,"febrero":2,"marzo":3,"abril":4,"mayo":5,"junio":6,"julio":7,"agosto":8,"septiembre":9,"octubre":10,"noviembre":11,"diciembre":12};
      var ahora = Date.now();
      var tombs = loadTombs();
      var tombUsado = tombs.map(function(){ return false; });
      var tombsCambio = false;
      var parsedAct = [], parsedElim = [];
      (rows || []).forEach(function(r) {
        if (!r) return;
        var nota = (r.nota || "").toString().toLowerCase();
        var esEliminado = nota.indexOf("eliminado") !== -1;
        var mesId = null;
        // FIX SYNC: priorizar campo "mes" (refleja la pestaña en que se guardó)
        if (r.mes) {
          var k = String(r.mes).toLowerCase().trim();
          var n = MES_NUM[k];
          if (n) {
            var yBase = (new Date()).getFullYear();
            if (r.fecha) {
              var dRef = new Date(r.fecha);
              if (!isNaN(dRef.getTime())) yBase = dRef.getFullYear();
            }
            mesId = yBase + "-" + String(n).padStart(2,"0");
          }
        }
        if (!mesId && r.fecha) {
          var d = new Date(r.fecha);
          if (!isNaN(d.getTime())) mesId = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
        }
        if (!mesId) return;
        var asesor = String(r.asesor || "").toLowerCase().trim();
        if (!asesor) return;
        if (ASESORES.indexOf(asesor) === -1) {
          var matched = ASESORES.find(function(a){ return asesor.indexOf(a) === 0 || asesor === a; });
          if (!matched) return;
          asesor = matched;
        }
        var dia = String(r.dia || "").trim();
        if (!dia) return;
        var venta = { orden: r.orden || "-", plan: r.plan || "-", valor: String(parseFloat(r.valorUsd) || 0), ts: r.ts || "" };
        var key = ventaKey(mesId, asesor, dia, venta);
        if (esEliminado) { parsedElim.push({ key:key, ts:tsMs(venta.ts) }); return; }
        parsedAct.push({ mesId:mesId, asesor:asesor, dia:dia, venta:venta, key:key });
      });

      // FIX BORRADO (Apps Script): hasta ahora "eliminar" agregaba una fila nueva con nota
      // "eliminado de real" en vez de marcar la venta. Cada una de esas filas descuenta UNA venta
      // con los mismos datos: primero la de la misma hora de registro; si no, la más reciente
      // registrada antes del borrado. Así se aplican también los borrados que ya están en el Sheet.
      var anulada = parsedAct.map(function(){ return false; });
      parsedElim.forEach(function(e) {
        var elegido = -1, j;
        if (e.ts) for (j = 0; j < parsedAct.length; j++) {
          if (!anulada[j] && parsedAct[j].key === e.key && Math.abs(tsMs(parsedAct[j].venta.ts) - e.ts) < 1500) { elegido = j; break; }
        }
        if (elegido < 0) for (j = 0; j < parsedAct.length; j++) {
          if (anulada[j] || parsedAct[j].key !== e.key) continue;
          var ta = tsMs(parsedAct[j].venta.ts);
          if (!e.ts || !ta || ta <= e.ts + 5000) elegido = j;
        }
        if (elegido >= 0) anulada[elegido] = true;
      });

      parsedAct.forEach(function(x, j) {
        if (anulada[j]) return;
        var mesId = x.mesId, asesor = x.asesor, dia = x.dia, venta = x.venta, key = x.key;
        // Si este navegador ya la eliminó y el Sheet todavía no lo refleja, no mostrarla
        var tsV = tsMs(venta.ts), ti = -1;
        for (var i = 0; i < tombs.length; i++) {
          if (!tombUsado[i] && tombMatch(tombs[i], key, tsV)) { ti = i; break; }
        }
        if (ti !== -1) { tombUsado[ti] = true; return; }
        next[mesId] = next[mesId] || {};
        next[mesId][asesor] = next[mesId][asesor] || {};
        var lista = next[mesId][asesor][dia] = next[mesId][asesor][dia] || [];
        var ocurr = lista.filter(function(y){ return y._key === key; }).length;
        venta._key = key;
        venta.id = "rt|" + key + "|" + String(venta.ts) + "#" + ocurr;
        lista.push(venta);
      });
      // Tombstones resueltos: el Sheet ya no devuelve la fila → limpiar
      var tombsVivos = tombs.filter(function(t, i) {
        return (tombUsado[i] || (ahora - t.deletedAt) < 60000) && (ahora - t.deletedAt) < 2*86400000;
      });
      if (tombsVivos.length !== tombs.length || tombsCambio) saveTombs(tombsVivos);

      // FIX SYNC: conservar SOLO ventas locales pendientes (aún no confirmadas por el Sheet),
      // máximo 3 minutos. Antes se re-agregaba cualquier venta local que no viniera del Sheet,
      // lo que revivía ventas eliminadas desde otro equipo y duplicaba órdenes.
      var usados = {};
      Object.keys(prev).forEach(function(mesId) {
        if (!/^\d{4}-\d{2}$/.test(mesId)) return;
        var mesPrev = prev[mesId] || {};
        next[mesId] = next[mesId] || {};
        Object.keys(mesPrev).forEach(function(k) {
          if (ASESORES.indexOf(k) === -1) { next[mesId][k] = mesPrev[k]; return; }
          var asesorPrev = mesPrev[k] || {};
          Object.keys(asesorPrev).forEach(function(dia) {
            (asesorPrev[dia] || []).forEach(function(pv) {
              if (!pv || !pv._pending) return;
              if (ahora - tsMs(pv.ts) > 180000) return;
              var key = ventaKey(mesId, k, dia, pv);
              var lista = ((next[mesId][k] || {})[dia]) || [];
              var match = lista.find(function(nv){ return nv._key === key && !usados[nv.id]; });
              if (match) { usados[match.id] = true; return; }
              next[mesId][k] = next[mesId][k] || {};
              next[mesId][k][dia] = next[mesId][k][dia] || [];
              next[mesId][k][dia].push(pv);
            });
          });
        });
      });
      return next;
    };

    const cargarYRefrescar = async function() {
      try {
        let res = await fetch(REMOTE_URL, { method:"GET", cache:"no-store" });
        let data = await res.json();
        if (cancelled) return;
        if (!data || !data.ok || !Array.isArray(data.rows)) return;

        // ── RESET: si el Sheet está vacío, limpiar store local de ventas ──────
        // Preservamos config (metas) pero borramos todas las ventas locales
        if (data.rows.length === 0) {
          var emptyStore = { config: (storeRef.current && storeRef.current.config) || {} };
          var emptyStr = JSON.stringify(emptyStore);
          if (JSON.stringify(storeRef.current) !== emptyStr) {
            storeRef.current = emptyStore;
            setStore(emptyStore);
            try { localStorage.setItem(STORE_KEY, emptyStr); } catch(e) {}
          }
          // Aún procesar configs si vienen
          if (data.configs && typeof data.configs === "object") {
            Object.keys(data.configs).forEach(function(mid) {
              var rem = data.configs[mid] || {};
              var loc = (storeRef.current && storeRef.current.config && storeRef.current.config[mid]) || {};
              if (!loc._localUpdatedAt) {
                _remoteConfigCache[mid] = {
                  meta:     rem.meta     !== undefined ? rem.meta     : rem.metaBase || 12500,
                  comision: rem.comision !== undefined ? rem.comision : rem.pctBase  || 10,
                  metaBase: rem.metaBase !== undefined ? rem.metaBase : 12500,
                  pctBase:  normalizePct(rem.pctBase  !== undefined ? rem.pctBase  : 10),
                  metaSfly: rem.metaSfly !== undefined ? rem.metaSfly : 18000,
                  pctSfly:  normalizePct(rem.pctSfly  !== undefined ? rem.pctSfly  : 15),
                };
                _remoteConfigLoaded = true;
              }
            });
            setConfigSource("remote");
          }
          return;
        }
        // ─────────────────────────────────────────────────────────────────────

        const newStore = buildStoreFromRows(data.rows);
        // FIX METAS: merge inteligente — la edición LOCAL más reciente prevalece sobre la remota
        if (data.configs && typeof data.configs === "object") {
          // NUEVO: también poblar el cache remoto de Config del Sheet
          Object.keys(data.configs).forEach(function(mid) {
            var rem = data.configs[mid] || {};
            // Solo actualizar cache remoto si NO hay edición local reciente
            var loc = (storeRef.current && storeRef.current.config && storeRef.current.config[mid]) || {};
            if (!loc._localUpdatedAt) {
              _remoteConfigCache[mid] = {
                meta:     rem.meta     !== undefined ? rem.meta     : rem.metaBase || 12500,
                comision: normalizePct(rem.comision !== undefined ? rem.comision : rem.pctBase  || 10),
                metaBase: rem.metaBase !== undefined ? rem.metaBase : 12500,
                pctBase:  normalizePct(rem.pctBase  !== undefined ? rem.pctBase  : 10),
                metaSfly: rem.metaSfly !== undefined ? rem.metaSfly : 18000,
                pctSfly:  normalizePct(rem.pctSfly  !== undefined ? rem.pctSfly  : 15),
              };
              _remoteConfigLoaded = true;
            }
          });
          setConfigSource("remote");
          var mergedCfg = Object.assign({}, newStore.config || {});
          Object.keys(data.configs).forEach(function(mid) {
            var rem = data.configs[mid] || {};
            var loc = mergedCfg[mid] || {};
            var locTs = loc._localUpdatedAt || loc.updatedAt || "";
            var remTs = rem.updatedAt || "";
            if (locTs && (!remTs || remTs < locTs)) {
              mergedCfg[mid] = loc;
            } else {
              var clean = Object.assign({}, rem);
              delete clean._localUpdatedAt;
              mergedCfg[mid] = clean;
            }
          });
          Object.keys(newStore.config || {}).forEach(function(mid) {
            if (!mergedCfg[mid]) mergedCfg[mid] = newStore.config[mid];
          });
          newStore.config = mergedCfg;
        }
        const sig = JSON.stringify(newStore);
        if (sig === lastSig) return;
        lastSig = sig;
        storeRef.current = newStore;
        setStore(newStore);
        try { localStorage.setItem(STORE_KEY, sig); } catch(e) {}
      } catch(e) {}
    };

    cargarYRefrescar();
    let id = setInterval(cargarYRefrescar, 4000);
    // FIX SYNC: exponer refresh manual para que onUpdate dispare lectura inmediata
    window.__SF_refreshNow = function(){ try { lastSig = ""; cargarYRefrescar(); } catch(e){} };
    return function() { cancelled = true; clearInterval(id); window.__SF_refreshNow = null; };
  }, []);


  const onUpdate = useCallback(function(newStore) {
    storeRef.current = newStore;
    setStore(newStore);
    // FIX SYNC: tras una mutación local, reintentar refresh remoto en 1.5s y 5s
    try { setTimeout(function(){ if (window.__SF_refreshNow) window.__SF_refreshNow(); }, 1500); } catch(e){}
    try { setTimeout(function(){ if (window.__SF_refreshNow) window.__SF_refreshNow(); }, 5000); } catch(e){}
  },[]);

  const onSaveConfig = useCallback(function(cfg) {
    // FIX METAS: marcar la config con timestamp local para que el polling no la sobrescriba
    var nowIso = new Date().toISOString();
    var cfgConTs = Object.assign({}, cfg, { updatedAt: nowIso, _localUpdatedAt: nowIso });
    let next = setConfigStore(storeRef.current, mesId, cfgConTs);
    onUpdate(next);
    // FIX METAS: enviar al backend con reintentos; el polling verificará persistencia
    try { enviarConfigRT(cfgConTs, mesId, "", nowIso); } catch(e) {}
  },[mesId]);

  const handleSync = () => setShowPin(true);
  // CAMBIO #1: sincroniza todos los meses
  const onPinSuccess = async () => {
    setShowPin(false);
    await sincronizarConSheets(storeRef.current, false);
  };

  let cfg      = getConfig(store,mesId);
  let mesInfo  = getMesInfo(mesId);
  let diaHoy   = mesId===getMesActual()?getDiaHoy():mesInfo.dias;
  let diasRest = Math.max(1,mesInfo.dias-diaHoy);

  // ── LAYOUT ESTILO BOLSA ──────────────────────────────────────────────────
  const isMobile = useIsMobile(900);
  const [mobLista, setMobLista] = useState("asesores"); // "asesores" | "herramientas" | null (detalle)
  const [mobOrigen, setMobOrigen] = useState("asesores");
  const legacyRef = useRef(null);
  const esAsesor = ASESORES.indexOf(tab) !== -1;
  const heroIds  = tab==="global" ? ASESORES : esAsesor ? [tab] : null;
  const toolInfo = BX_TOOLS.find(t=>t.id===tab);
  const ir = function(id) {
    setMobOrigen(BX_TOOLS.some(t=>t.id===id)?"herramientas":"asesores");
    setTab(id); setMobLista(null);
    try { const m=document.getElementById("bx-main"); if(m) m.scrollTo({top:0}); window.scrollTo({top:0}); } catch(e) {}
  };
  const verRegistro = function() { try { legacyRef.current.scrollIntoView({behavior:"smooth",block:"start"}); } catch(e) {} };

  const legacy = (
    <div>
      {tab==="global"    &&<GlobalTab store={store} mesId={mesId} configSource={configSource} sinCabecera />}
      {esAsesor          &&<AdvisorTab key={tab} name={ASESORES_NOMBRES[tab]||cap(tab)} asesor={tab} color={ASESORES_COLORES[tab]||"#6366f1"} store={store} mesId={mesId} onUpdate={onUpdate} configSource={configSource} sinHeader />}
      {tab==="tracker"   &&<TrackerTab store={store} />}
      {tab==="tosspile"  &&<TosspileTab store={store} onUpdate={onUpdate} />}
      {tab==="docs"       &&<DocumentosTab />}
      {tab==="duplicados" &&<DuplicadosTab store={store} mesId={mesId} onIr={ir} />}
      {tab==="calc"      &&<CalcTab />}
      {tab==="malla"     &&<MallaTab mesId={mesId} store={store} />}
      {tab==="alianzas"  &&<AlianzasTab />}
    </div>
  );
  const hero = heroIds ? (
    <BolsaDetalle store={store} mesId={mesId} ids={heroIds}
      titulo={tab==="global"?"Equipo":(ASESORES_NOMBRES[tab]||cap(tab)).split(" ")[0]}
      subtitulo={tab==="global"?"SegurosFly · Revenue total":(ASESORES_NOMBRES[tab]||cap(tab))}
      onVerRegistro={verRegistro} onIr={ir} />
  ) : <BolsaTitulo titulo={toolInfo?toolInfo.label:"SegurosFly"} sub={toolInfo?toolInfo.sub+" · "+mesInfo.label:""} />;
  const selMes = (
    <select className="bx-mes" value={mesId} onChange={e=>setMesId(e.target.value)} aria-label="Mes">
      {MESES.map(m=><option key={m.id} value={m.id}>{m.label}</option>)}
    </select>
  );
  const acciones = (
    <div className="bx-acc">
      <button onClick={()=>descargarCSV(storeRef.current,mesId)} title="Descargar CSV del mes" aria-label="Descargar CSV">
        <svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M9 13V1M4.5 5.5 9 1l4.5 4.5M3 9H2v10h14V9h-1"/></svg>
      </button>
      <span className="bx-acc-sep"/>
      <button onClick={handleSync} title="Sincronizar con Google Sheets" aria-label="Sincronizar">
        <svg width="20" height="18" viewBox="0 0 20 18" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M17 4v4h-4M3 14v-4h4"/><path d="M16.3 8A7 7 0 0 0 4 5.2M3.7 10A7 7 0 0 0 16 12.8"/></svg>
      </button>
    </div>
  );
  const modales = (<>{showPin&&<ModalPin onSuccess={onPinSuccess} onCancel={()=>setShowPin(false)} />}<ModalPinAsesor /></>);

  if (!isMobile) return (
    <div className="bx-app" style={{display:"flex",height:"100vh",background:BX.bg,overflow:"hidden"}}>
      {modales}
      <aside className="bx-side" style={{background:BX.side,borderRight:"1px solid #000",display:"flex",flexDirection:"column",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"16px 16px 4px"}}>
          <img src={LOGO_SQ_SRC} alt="" style={{width:30,height:30,borderRadius:8,objectFit:"contain",background:"#fff"}} />
          <span style={{fontFamily:BX.font,fontSize:17,fontWeight:800,color:BX.txt,letterSpacing:"-0.02em",flex:1}}>SegurosFly</span>
          {selMes}
        </div>
        <div style={{flex:1,minHeight:0}}>
          <BolsaSidebar store={store} mesId={mesId} tab={tab} onSelect={ir} dupCount={dupCount} />
        </div>
      </aside>
      <main id="bx-main" style={{flex:1,overflowY:"auto",minWidth:0}}>
        <div style={{position:"sticky",top:0,zIndex:40,display:"flex",justifyContent:"flex-end",alignItems:"center",gap:14,padding:"12px 24px",background:BX.bg+"ee",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",fontFamily:BX.font}}>
          <span style={{fontSize:13,color:BX.txt2}}>Día {diaHoy} de {mesInfo.dias} · <b style={{color:BX.txt}}>{diasRest} días</b> restantes</span>
          {acciones}
        </div>
        <div className="bx-wrap">
          {hero}
          <div ref={legacyRef} className="bx-legacy" style={{marginTop:heroIds?36:0}}>{legacy}</div>
        </div>
      </main>
    </div>
  );

  // ── MÓVIL: lista ↔ detalle + barra inferior ──────────────────────────────
  const navItems = [
    { id:"asesores",     label:"Asesores",     icon:"📈" },
    { id:"herramientas", label:"Herramientas", icon:"🧰", badge:dupCount },
  ];
  const navActivo = mobLista || mobOrigen;
  return (
    <div className="bx-app bx-mob" style={{minHeight:"100vh",background:BX.bg,paddingBottom:"calc(70px + env(safe-area-inset-bottom))"}}>
      {modales}
      <header style={{position:"sticky",top:0,zIndex:60,display:"flex",alignItems:"center",gap:10,padding:"10px 14px",paddingTop:"calc(10px + env(safe-area-inset-top))",
        background:BX.bg+"f2",backdropFilter:"blur(14px)",WebkitBackdropFilter:"blur(14px)",borderBottom:"1px solid "+BX.line2,fontFamily:BX.font}}>
        {mobLista ? (
          <span style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:0}}>
            <img src={LOGO_SQ_SRC} alt="" style={{width:28,height:28,borderRadius:7,background:"#fff",objectFit:"contain"}} />
            <span style={{fontSize:20,fontWeight:800,color:BX.txt,letterSpacing:"-0.02em"}}>SegurosFly</span>
          </span>
        ) : (
          <button onClick={()=>{ setMobLista(mobOrigen); window.scrollTo({top:0}); }} style={{all:"unset",cursor:"pointer",flex:1,display:"flex",alignItems:"center",gap:4,color:BX.blue,fontSize:17,fontWeight:600,minHeight:44}}>
            <span style={{fontSize:24,lineHeight:1}}>‹</span> {mobOrigen==="herramientas"?"Herramientas":"Asesores"}
          </button>
        )}
        {selMes}
        {acciones}
      </header>
      {mobLista ? (
        <BolsaSidebar key={mobLista} store={store} mesId={mesId} tab={tab} onSelect={ir} dupCount={dupCount} mobile solo={mobLista} />
      ) : (
        <div style={{padding:"16px 14px 0"}}>
          {hero}
          <div ref={legacyRef} className="bx-legacy" style={{marginTop:heroIds?26:0}}>{legacy}</div>
        </div>
      )}
      <nav aria-label="Navegación" style={{position:"fixed",left:0,right:0,bottom:0,zIndex:90,display:"flex",background:BX.side+"f5",backdropFilter:"blur(16px)",WebkitBackdropFilter:"blur(16px)",
        borderTop:"1px solid "+BX.line,paddingBottom:"env(safe-area-inset-bottom)",fontFamily:BX.font}}>
        {navItems.map(n=>{ const act=navActivo===n.id; return (
          <button key={n.id} onClick={()=>{ setMobLista(n.id); setMobOrigen(n.id); window.scrollTo({top:0}); }}
            aria-current={act?"page":undefined}
            style={{all:"unset",cursor:"pointer",flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:3,minHeight:58,position:"relative",
              color:act?BX.blue:BX.txt2}}>
            <span style={{fontSize:20,lineHeight:1,filter:act?"none":"grayscale(1)",opacity:act?1:0.8}}>{n.icon}</span>
            <span style={{fontSize:11,fontWeight:600}}>{n.label}</span>
            {n.badge>0&&<span style={{position:"absolute",top:6,left:"calc(50% + 6px)",background:BX.down,color:"#fff",borderRadius:9,padding:"0 5px",fontSize:10,fontWeight:800}}>{n.badge}</span>}
          </button>
        );})}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
