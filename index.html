// ── ADVISOR TAB ────────────────────────────────────────────────────────────────
function AdvisorTab({name,asesor,color,store,mesId,onUpdate}) {
  const mesInfo   = getMesInfo(mesId);
  const diaHoyMes = mesId===getMesActual()?getDiaHoy():1;
  const [dia,setDia]         = useState(diaHoyMes);
  const [form,setForm]       = useState({orden:"",valor:"",plan:"Plan Smart"});
  const [editId,setEditId]   = useState(null);
  const [status,setStatus]   = useState(null);
  const [confirmDel,setConfirmDel] = useState(null);

  useEffect(()=>{ setDia(mesId===getMesActual()?getDiaHoy():1); },[mesId]);

  const data    = getMonthData(store,mesId,asesor);
  const cfg     = getConfig(store,mesId);
  const metaInd = cfg.metaBase/2;
  const metaBaseSolo = cfg.metaBase/2;
  const metaSlySolo  = cfg.metaSfly/2;

  // Total del equipo completo — determina en qué piso de comisión están todos
  const totalEquipo = ASESORES.reduce((s,a)=>{
    const rows = Object.values(getMonthData(store,mesId,a)).reduce((a,b)=>a.concat(b),[]);
    return s + sumR(rows);
  }, 0);

  const allRows   = Object.values(data).reduce((a,b)=>a.concat(b),[]);
  const acum      = sumR(allRows);
  const totalVtas = allRows.length;
  const diasCon   = Object.keys(data).filter(d=>data[d]&&data[d].length>0).length;
  const diaHoy    = mesId===getMesActual()?getDiaHoy():mesInfo.dias;
  const diasRest  = Math.max(1,mesInfo.dias-diaHoy);
  const promDia   = diasCon>0?acum/diasCon:0;
  const proy      = acum+promDia*diasRest;
  const rowsHoy   = data[dia]||[];
  const totHoy    = sumR(rowsHoy);

  // CAMBIO #2: guardar también envía a RealTime
  const saveRow = async () => {
    if (!form.valor) return;
    const pinOk = await verificarPinAsesor(asesor);
    if (!pinOk) { return; }
    setStatus("saving");
    const day    = data[dia]||[];
    const newRow = {id:uid(),orden:form.orden,valor:form.valor,plan:form.plan,ts:Date.now()};
    const updated = editId ? day.map(r=>r.id===editId?Object.assign({},r,form):r) : day.concat([newRow]);
    const newData = Object.assign({},data,{[dia]:updated});
    onUpdate(setMonthData(store,mesId,asesor,newData));
    setForm({orden:"",valor:"",plan:"Plan Smart"}); setEditId(null);
    // Enviar a RealTime
    await enviarRealTime(Object.assign({},newRow,{dia}), mesId, asesor);
    setStatus("ok"); setTimeout(()=>setStatus(null),3000);
  };

  const requestDelete = (r) => setConfirmDel(Object.assign({},r,{asesor:asesor,dia:dia}));

  const confirmDelete = async () => {
    if (!confirmDel) return;
    const pinOk2 = await verificarPinAsesor(asesor);
    if (!pinOk2) { setConfirmDel(null); return; }
    const updated    = (data[confirmDel.dia]||[]).filter(r=>r.id!==confirmDel.id);
    const newData    = Object.assign({},data,{[confirmDel.dia]:updated});
    const deletedFila = Object.assign({},confirmDel,{deletedAt:new Date().toISOString()});
    let newStore = setMonthData(store,mesId,asesor,newData);
    newStore     = pushDeleted(newStore,deletedFila);
    onUpdate(newStore);
    await enviarEliminacion(deletedFila,mesId);
    setConfirmDel(null);
  };

  const startEdit = (r) => { setForm({orden:r.orden,valor:r.valor,plan:r.plan||"Plan Smart"}); setEditId(r.id); };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {confirmDel&&<ModalConfirmDelete fila={confirmDel} onConfirm={confirmDelete} onCancel={()=>setConfirmDel(null)} />}
      {/* CABECERA CON LOGO + STATS DEL ASESOR (reemplaza BloqueOperativo) */}
      <AsesorHeader name={name} asesor={asesor} color={color} data={data} mesId={mesId} diaHoy={diaHoy} />

      <div className="mob-g4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        <StatCard label="Revenue Acumulado" value={usd(acum,0)} accent={color} large />
        <StatCard label="Ventas realizadas" value={totalVtas+" ventas"} sub={diasCon+" dias con ventas"} accent={color} />
        <StatCard label="Proyeccion Cierre" value={usd(proy,0)} sub={diasRest+" dias restantes"} />
        <StatCard label="Faltante meta" value={acum>=metaInd?"Logrado":usd(metaInd-acum,0)} accent={acum>=metaInd?"#10b981":"#ef4444"} />
      </div>

      {/* CAMBIO #5: Análisis automático */}
      <AnalisisAutomatico acum={acum} proy={proy} promDia={promDia} name={name} mesId={mesId} metaBase={metaBaseSolo} metaSfly={metaSlySolo} color={color} />

      {/* CAMBIO #6: Progreso a metas */}
      <ProgresoMetas acum={acum} proy={proy} mesId={mesId} metaBase={metaBaseSolo} metaSfly={metaSlySolo} color={color} />

      {/* CAMBIO #7: Qué pasa si */}
      <QueParaSi acum={acum} mesId={mesId} metaBase={metaBaseSolo} metaSfly={metaSlySolo} color={color} />

      <PanelPresion acum={acum} promDia={promDia} proy={proy} name={name} mesId={mesId} metaInd={metaInd} />

      <ComisionesPanel acum={acum} proy={proy} color={color} label={name} cfg={cfg} totalEquipo={totalEquipo} />

      {/* CAMBIO #8: Registro Diario con alertas días sin registro */}
      <Card>
        <SLabel>📅 Registro Diario — {name}</SLabel>
        <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:14}}>
          {Array.from({length:mesInfo.dias},(_,i)=>i+1).map(d=>{
            const tiene=(data[d]||[]).length>0, sel=d===dia, esHoy=d===diaHoyMes;
            const sinRegistro = d<=diaHoy && !tiene;
            return (
              <button key={d} onClick={()=>setDia(d)} style={{width:33,height:33,borderRadius:7,cursor:"pointer",
                border:sel?"2px solid "+color:esHoy?"2px dashed "+color+"88":sinRegistro?"1.5px solid #fb923c":"1px solid #e2e8f0",
                background:sel?color:tiene?"#ecfdf5":sinRegistro?"#fff7ed":"#f8fafc",
                color:sel?"#fff":tiene?"#059669":sinRegistro?"#ea580c":(d>diaHoyMes&&mesId===getMesActual())?"#cbd5e1":"#64748b",
                fontWeight:(sel||tiene||sinRegistro)?700:400,fontSize:11,position:"relative"}}>
                {d}
                {tiene&&!sel&&<span style={{position:"absolute",top:2,right:2,width:4,height:4,background:"#10b981",borderRadius:"50%"}} />}
                {sinRegistro&&!sel&&<span style={{position:"absolute",top:1,right:1,width:5,height:5,background:"#fb923c",borderRadius:"50%",fontSize:8,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:900}}>!</span>}
              </button>
            );
          })}
        </div>
        {/* BANNER: mes y día activo — para que el asesor siempre sepa dónde está registrando */}
        {(()=>{
          const esHoy = dia===diaHoyMes && mesId===getMesActual();
          const esMesActual = mesId===getMesActual();
          const mesLabel = getMesInfo(mesId).label;
          const bannerBg = !esMesActual ? "#fff7ed" : esHoy ? "#f0fdf4" : "#eff6ff";
          const bannerBorder = !esMesActual ? "#fb923c" : esHoy ? "#10b981" : "#2563eb";
          const bannerIcon = !esMesActual ? "⚠️" : esHoy ? "📍" : "📅";
          const bannerMsg = !esMesActual
            ? `Estás registrando en ${mesLabel} — ¡no es el mes actual!`
            : esHoy
            ? `Registrando en ${mesLabel} · Día ${dia} (hoy)`
            : `Registrando en ${mesLabel} · Día ${dia} — no es hoy`;
          return (
            <div style={{background:bannerBg,border:"2px solid "+bannerBorder,borderRadius:10,
              padding:"10px 16px",marginBottom:10,display:"flex",alignItems:"center",
              justifyContent:"space-between",gap:10}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:18}}>{bannerIcon}</span>
                <div>
                  <div style={{fontSize:12,fontWeight:800,color:bannerBorder}}>{bannerMsg}</div>
                  <div style={{fontSize:11,color:"#64748b",marginTop:1}}>
                    {rowsHoy.length} registro{rowsHoy.length!==1?"s":""} · {usd(totHoy)} en este día
                  </div>
                </div>
              </div>
              {!esMesActual && (
                <div style={{fontSize:10,fontWeight:700,color:"#ea580c",background:"#fff",
                  border:"1px solid #fb923c",borderRadius:6,padding:"3px 8px",whiteSpace:"nowrap"}}>
                  Mes incorrecto
                </div>
              )}
              {esMesActual && (
                <span style={{fontSize:18,fontWeight:800,color:bannerBorder}}>{usd(totHoy)}</span>
              )}
            </div>
          );
        })()}
        <div className="mob-form" style={{display:"grid",gridTemplateColumns:"1fr 100px 1fr auto",gap:8,marginBottom:10}}>
          <input value={form.orden} onChange={e=>setForm(Object.assign({},form,{orden:e.target.value}))} placeholder="Orden / cliente" style={iStyle} />
          <input value={form.valor} onChange={e=>setForm(Object.assign({},form,{valor:e.target.value}))} type="number" min="0" step="0.01" placeholder="USD" style={iStyle} />
          <select value={form.plan} onChange={e=>setForm(Object.assign({},form,{plan:e.target.value}))} style={iStyle}>
            {PLANES.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          <button onClick={saveRow} style={btnS(editId?"#6366f1":color)} disabled={status==="saving"}>
            {status==="saving"?"Guardando...":editId?"Actualizar":"+ Guardar"}
          </button>
        </div>
        {status&&status!=="saving"&&(
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10,padding:"7px 12px",borderRadius:8,background:"#f0fdf4",border:"1px solid #a7f3d0",animation:"fadeIn 0.2s ease"}}>
            <span>✅</span><span style={{fontSize:12,fontWeight:600,color:"#059669"}}>Guardado correctamente · Enviado a RealTime</span>
          </div>
        )}
        {rowsHoy.length>0?(
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            {rowsHoy.map(r=>(
              <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 12px"}}>
                <span style={{flex:1,fontSize:13,color:"#334155",fontWeight:600}}>{r.orden||"-"}</span>
                <span style={{fontSize:11,color:"#94a3b8",minWidth:110}}>{r.plan||"-"}</span>
                <span style={{fontSize:15,fontWeight:800,color:color,minWidth:80,textAlign:"right"}}>{usd(r.valor)}</span>
                <button onClick={()=>startEdit(r)}     style={icoBtn("#6366f1")}>✎</button>
                <button onClick={()=>requestDelete(r)} style={icoBtn("#ef4444")}>✕</button>
              </div>
            ))}
            <div style={{textAlign:"right",fontSize:14,fontWeight:800,color:color,padding:"6px 12px",borderTop:"1px solid #f1f5f9"}}>Total: {usd(totHoy)}</div>
          </div>
        ):(
          <div style={{textAlign:"center",color:"#94a3b8",fontSize:13,padding:"18px 0"}}>Sin registros para el dia {dia}. Agrega tu primera venta</div>
        )}
      </Card>

      {/* CAMBIO #8: HistorialPanel ya incluye alertas naranja */}
      <HistorialPanel data={data} color={color} mesId={mesId} />
    </div>
  );
}

// ── GLOBAL TAB ─────────────────────────────────────────────────────────────────
function GlobalTab({store,mesId,configSource}) {
  const mesInfo  = getMesInfo(mesId);
  const cfg      = getConfig(store,mesId);
  const diaHoy   = mesId===getMesActual()?getDiaHoy():mesInfo.dias;
  const diasRest = Math.max(1,mesInfo.dias-diaHoy);
  const gData    = getMonthData(store,mesId,"guillermo");
  const cData    = getMonthData(store,mesId,"carolina");
  const dData    = getMonthData(store,mesId,"daniel");
  const wData    = getMonthData(store,mesId,"wilmary");
  const gRows    = Object.values(gData).reduce((a,b)=>a.concat(b),[]);
  const cRows    = Object.values(cData).reduce((a,b)=>a.concat(b),[]);
  const dRows    = Object.values(dData).reduce((a,b)=>a.concat(b),[]);
  const wRows    = Object.values(wData).reduce((a,b)=>a.concat(b),[]);
  const gAcum    = sumR(gRows), cAcum = sumR(cRows), dAcum = sumR(dRows), wAcum = sumR(wRows), total = gAcum+cAcum+dAcum+wAcum;
  const gVentas  = gRows.length, cVentas = cRows.length, dVentas = dRows.length, wVentas = wRows.length;
  const gDias    = Object.keys(gData).filter(d=>gData[d]&&gData[d].length>0).length;
  const cDias    = Object.keys(cData).filter(d=>cData[d]&&cData[d].length>0).length;
  const dDias    = Object.keys(dData).filter(d=>dData[d]&&dData[d].length>0).length;
  const wDias    = Object.keys(wData).filter(d=>wData[d]&&wData[d].length>0).length;
  const gProm    = gDias>0?gAcum/gDias:0, cProm = cDias>0?cAcum/cDias:0, dProm = dDias>0?dAcum/dDias:0, wProm = wDias>0?wAcum/wDias:0;
  const gProy    = gAcum+gProm*diasRest, cProy = cAcum+cProm*diasRest, dProy = dAcum+dProm*diasRest, wProy = wAcum+wProm*diasRest, totProy = gProy+cProy+dProy+wProy;
  const metaEq   = cfg.metaBase;
  const metaInd  = cfg.metaBase/2;
  // comPct = piso actual del equipo según total acumulado
  // cfg.comision=10%(base) cfg.pctBase=11%(meta) cfg.pctSfly=12%(SFly)
  const pct1eq = normalizePct(cfg.comision||10)/100;
  const pct2eq = normalizePct(cfg.pctBase||11)/100;
  const pct3eq = normalizePct(cfg.pctSfly||12)/100;
  const pisoEq = total >= (cfg.metaSfly||13000) ? 3 : total >= (cfg.metaBase||10000) ? 2 : 1;
  const comPct = pisoEq===3 ? pct3eq : pisoEq===2 ? pct2eq : pct1eq;
  const maxBar   = Math.max(gAcum,cAcum,dAcum,wAcum,1);
  const liderAcum = Math.max(gAcum,cAcum,dAcum,wAcum);
  const lider    = liderAcum===gAcum?"Guillermo":liderAcum===cAcum?"Carolina":liderAcum===dAcum?"Daniel R.":"Wilmary";
  const liderC   = liderAcum===gAcum?"#2563eb":liderAcum===cAcum?"#7c3aed":liderAcum===dAcum?"#0f766e":"#be185d";
  const revPorDia = {};
  [gData,cData,dData,wData].forEach(d=>Object.entries(d).forEach(function(e){ revPorDia[e[0]]=(revPorDia[e[0]]||0)+sumR(e[1]); }));
  const diasOrd = Object.keys(revPorDia).sort((a,b)=>+a-+b);
  const maxDia  = Math.max.apply(null,Object.values(revPorDia).concat([1]));

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* STATS GLOBALES: TIQUE PROMEDIO + DIAS */}
      <GlobalDayStats gData={gData} cData={cData} dData={dData} wData={wData} mesId={mesId} total={total} gVentas={gVentas} cVentas={cVentas} dVentas={dVentas} wVentas={wVentas} gAcum={gAcum} cAcum={cAcum} dAcum={dAcum} wAcum={wAcum} />

      {/* CABECERA LOGO GLOBAL */}
      <div style={{background:"linear-gradient(135deg,#1e3a5f,#2c5282)",borderRadius:14,padding:"18px 24px",display:"flex",alignItems:"center",gap:16}}>
        <img src={LOGO_SQ_SRC} alt="Seguros Fly" style={{height:48,width:48,objectFit:"contain",borderRadius:8}} />
        <div>
          <div style={{fontSize:18,fontWeight:800,color:"#fff"}}>Seguros Fly · Dashboard Equipo</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.65)"}}>{getMesInfo(mesId).label} 2026</div>
        </div>
        <div style={{marginLeft:"auto",textAlign:"right"}}>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.5)",fontWeight:700,textTransform:"uppercase"}}>Revenue equipo</div>
          <div style={{fontSize:26,fontWeight:800,color:"#F59E0B"}}>{usd(total,0)}</div>
        </div>
      </div>

      {/* CAMBIO #4: Metas Globales */}
      <MetasGlobales store={store} mesId={mesId} total={total} proy={totProy} configSource={configSource} />

      <div style={{background:liderC+"08",border:"1.5px solid "+liderC+"33",borderRadius:12,padding:"14px 20px",display:"flex",alignItems:"center",gap:16}}>
        <span style={{fontSize:26}}>🏆</span>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:800,color:liderC}}>{lider} lidera por {usd(liderAcum-Math.max(...[gAcum,cAcum,dAcum].filter(v=>v!==liderAcum)),0)}</div>
          <div style={{fontSize:12,color:"#64748b",marginTop:3}}>G: {usd(gAcum,0)} ({gVentas}v) · C: {usd(cAcum,0)} ({cVentas}v) · D: {usd(dAcum,0)} ({dVentas}v) · W: {usd(wAcum,0)} ({wVentas}v)</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:11,color:"#94a3b8"}}>Proyeccion equipo</div>
          <div style={{fontSize:20,fontWeight:800,color:"#6366f1"}}>{usd(totProy,0)}</div>
        </div>
      </div>
      <div className="mob-g4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        <StatCard label="Revenue Equipo" value={usd(total,0)} accent="#6366f1" large />
        <StatCard label="Proyeccion Total" value={usd(totProy,0)} sub={"+"+(usd(totProy-total,0))+" potencial"} />
        <StatCard label="Faltante meta equipo" value={total>=metaEq?"Logrado":usd(metaEq-total,0)} accent={total>=metaEq?"#10b981":"#ef4444"} />

          {(()=>{
            // Piso proyectado — si el equipo proyecta superar la meta, usa el % del piso siguiente
            const pisoProy = totProy>=(cfg.metaSfly||13000)?3:totProy>=(cfg.metaBase||10000)?2:1;
            const comProy  = pisoProy===3?pct3eq:pisoProy===2?pct2eq:pct1eq;
            return [{l:"G actual",v:gAcum*comPct,c:"#2563eb"},{l:"G proyectada",v:gProy*comProy,c:"#2563eb"},

              {l:"D actual",v:dAcum*comPct,c:"#0f766e"},{l:"D proyectada",v:dProy*comProy,c:"#0f766e"},

// ── TRACKER ────────────────────────────────────────────────────────────────────
function TrackerTab({store}) {
  const mesesConDatos = MESES.filter(m=>ASESORES.some(a=>{
    const d=getMonthData(store,m.id,a);
    return Object.values(d).reduce((a,b)=>a.concat(b),[]).length>0;
  }));
  if (!mesesConDatos.length) return (
    <div style={{textAlign:"center",padding:"60px 20px",color:"#94a3b8"}}>
      <img src={LOGO_WEB_SRC} alt="Seguros Fly" style={{height:50,objectFit:"contain",margin:"0 auto",display:"block"}} />
      <div style={{fontSize:16,fontWeight:700,color:"#64748b",marginTop:16}}>Sin datos historicos aun</div>
      <div style={{fontSize:13,marginTop:6}}>Comienza registrando ventas en los meses activos</div>
    </div>
  );
  const resumen = mesesConDatos.map(m=>{
    const gData=getMonthData(store,m.id,"guillermo");
    const cData=getMonthData(store,m.id,"carolina");
    const dData=getMonthData(store,m.id,"daniel");
    const wData=getMonthData(store,m.id,"wilmary");
    const gRows=Object.values(gData).reduce((a,b)=>a.concat(b),[]);
    const cRows=Object.values(cData).reduce((a,b)=>a.concat(b),[]);
    const dRows=Object.values(dData).reduce((a,b)=>a.concat(b),[]);
    const wRows=Object.values(wData).reduce((a,b)=>a.concat(b),[]);
    const gAcum=sumR(gRows), cAcum=sumR(cRows), dAcum=sumR(dRows), wAcum=sumR(wRows), total=gAcum+cAcum+dAcum+wAcum;
    const cfg=getConfig(store,m.id);
    const cumplimiento=cfg.metaBase>0?(total/cfg.metaBase)*100:0;
    return Object.assign({},m,{gAcum,cAcum,dAcum,wAcum,total,gVentas:gRows.length,cVentas:cRows.length,dVentas:dRows.length,wVentas:wRows.length,cfg,cumplimiento});
  });
  const totalHistorico = resumen.reduce((s,r)=>s+r.total,0);
  const maxTotal = Math.max.apply(null,resumen.map(r=>r.total).concat([1]));
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div className="mob-g3" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        <StatCard label="Revenue Total Historico" value={usd(totalHistorico,0)} accent="#6366f1" large />
        <StatCard label="Meses con datos" value={mesesConDatos.length} sub="meses registrados" />
        <StatCard label="Promedio mensual" value={usd(totalHistorico/(mesesConDatos.length||1),0)} sub="por mes" />
      </div>
      <Card>
        <SLabel>Evolucion Mensual — Revenue Total</SLabel>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {resumen.map(r=>(
            <div key={r.id} style={{display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:12,fontWeight:700,color:"#64748b",minWidth:80}}>{r.label}</span>
              <div style={{flex:1,height:22,background:"#f1f5f9",borderRadius:6,overflow:"hidden",position:"relative"}}>
                <div style={{width:((r.gAcum/maxTotal)*100)+"%",height:"100%",background:"#2563eb",position:"absolute",left:0}} />
                <div style={{width:((r.cAcum/maxTotal)*100)+"%",height:"100%",background:"#7c3aed66",position:"absolute",left:((r.gAcum/maxTotal)*100)+"%"}} />
                <div style={{width:((r.dAcum/maxTotal)*100)+"%",height:"100%",background:"#0f766e88",position:"absolute",left:(((r.gAcum+r.cAcum)/maxTotal)*100)+"%"}} />
                <div style={{width:(((r.wAcum||0)/maxTotal)*100)+"%",height:"100%",background:"#be185d88",position:"absolute",left:(((r.gAcum+r.cAcum+r.dAcum)/maxTotal)*100)+"%"}} />
              </div>
              <span style={{fontSize:13,fontWeight:800,color:"#1e293b",minWidth:90,textAlign:"right"}}>{usd(r.total,0)}</span>
              <Pill color={r.cumplimiento>=100?"#10b981":r.cumplimiento>=80?"#3b82f6":"#f97316"}
                    bg={r.cumplimiento>=100?"#ecfdf5":r.cumplimiento>=80?"#eff6ff":"#fff7ed"} size={10}>{pc(r.cumplimiento)}</Pill>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:16,marginTop:10,fontSize:11,color:"#64748b"}}>
          <span><span style={{color:"#2563eb",fontWeight:700}}>■</span> Guillermo</span>
          <span><span style={{color:"#7c3aed",fontWeight:700}}>■</span> Carolina</span>
          <span><span style={{color:"#0f766e",fontWeight:700}}>■</span> Daniel R.</span>
          <span><span style={{color:"#be185d",fontWeight:700}}>■</span> Wilmary</span>
        </div>
      </Card>
      <Card>
        <SLabel>Comparativo Mensual Detallado</SLabel>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{borderBottom:"2px solid #f1f5f9"}}>
                {["Mes","Meta Base","Meta SFly","% Com","Guillermo","G Vtas","Carolina","C Vtas","Daniel R.","D Vtas","Wilmary","W Vtas","Total","Cumpl."].map(h=>(
                  <th key={h} style={{padding:"8px 10px",color:"#94a3b8",fontWeight:700,textTransform:"uppercase",fontSize:10,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {resumen.map((r,i)=>(
                <tr key={r.id} style={{borderBottom:"1px solid #f1f5f9",background:i%2===0?"#fff":"#fafafa"}}>
                  <td style={{padding:"9px 10px",fontWeight:700,color:"#1e293b",textAlign:"left"}}>{r.label}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#2563eb"}}>{usd(r.cfg.metaBase,0)}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#d97706"}}>{usd(r.cfg.metaSfly,0)}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#64748b"}}>{r.cfg.pctBase}%</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#2563eb",fontWeight:700}}>{usd(r.gAcum,0)}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#94a3b8"}}>{r.gVentas}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#7c3aed",fontWeight:700}}>{usd(r.cAcum,0)}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#94a3b8"}}>{r.cVentas}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#0f766e",fontWeight:700}}>{usd(r.dAcum,0)}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#94a3b8"}}>{r.dVentas}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#be185d",fontWeight:700}}>{usd(r.wAcum||0,0)}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",color:"#94a3b8"}}>{r.wVentas||0}</td>
                  <td style={{padding:"9px 10px",textAlign:"right",fontWeight:800,color:"#1e293b"}}>{usd(r.total,0)}</td>
                  <td style={{padding:"9px 10px",textAlign:"right"}}>
                    <Pill color={r.cumplimiento>=100?"#10b981":r.cumplimiento>=80?"#3b82f6":"#f97316"}
                          bg={r.cumplimiento>=100?"#ecfdf5":r.cumplimiento>=80?"#eff6ff":"#fff7ed"} size={10}>{pc(r.cumplimiento)}</Pill>
                  </td>
                </tr>
              ))}
              <tr style={{borderTop:"2px solid #e2e8f0",background:"#f8fafc"}}>
                <td style={{padding:"9px 10px",fontWeight:800,color:"#6366f1",textAlign:"left"}} colSpan={4}>TOTAL HISTORICO</td>
                <td style={{padding:"9px 10px",textAlign:"right",color:"#2563eb",fontWeight:800}}>{usd(resumen.reduce((s,r)=>s+r.gAcum,0),0)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",color:"#94a3b8",fontWeight:700}}>{resumen.reduce((s,r)=>s+r.gVentas,0)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",color:"#7c3aed",fontWeight:800}}>{usd(resumen.reduce((s,r)=>s+r.cAcum,0),0)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",color:"#94a3b8",fontWeight:700}}>{resumen.reduce((s,r)=>s+r.cVentas,0)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",color:"#0f766e",fontWeight:800}}>{usd(resumen.reduce((s,r)=>s+r.dAcum,0),0)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",color:"#94a3b8",fontWeight:700}}>{resumen.reduce((s,r)=>s+r.dVentas,0)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",color:"#be185d",fontWeight:800}}>{usd(resumen.reduce((s,r)=>s+(r.wAcum||0),0),0)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",color:"#94a3b8",fontWeight:700}}>{resumen.reduce((s,r)=>s+(r.wVentas||0),0)}</td>
                <td style={{padding:"9px 10px",textAlign:"right",fontWeight:800,color:"#6366f1",fontSize:14}}>{usd(totalHistorico,0)}</td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

// Índice por mes — agregar aquí los meses futuros
const MALLA_POR_MES = {
  "2026-08": MALLA_AGOSTO,
};
// ── MALLA SEGUROSFLY ─────────────────────────────────────────────────────────
// Agentes principales y socios de fin de semana
const MALLA_AGENTES  = ["Guillermo González","Wilmary Antolinez","Daniel Romero"];
const MALLA_SOCIOS   = ["Jhojan Torres","Wilker Casadiego","Otoniel Martell","Ricardo Torres"];
const MALLA_TURNOS   = [
  { id:"1", label:"Turno 1", horario:"08:00–16:00", color:"#2563eb" },
  { id:"3", label:"Turno 3", horario:"10:00–18:00", color:"#0f766e" },
  { id:"2", label:"Turno 2", horario:"14:00–22:00", color:"#7c3aed" },
  { id:"5", label:"Sáb T5",  horario:"08:00–15:00", color:"#b45309" },
  { id:"6", label:"Dom T6",  horario:"13:00–20:00", color:"#be185d" },
  { id:"4", label:"Nocturno",horario:"22:00–08:00", color:"#475569" },
];
const MESES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
                  "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// Parsea las filas crudas del Sheet en estructura útil
function parseMallaRows(rows) {
  // rows viene del read?sheet=Malla de SegurosFly
  // Columnas: A=Turno B=Horario C=dia1/mes D=dia2/mes ...
  // Primera fila: encabezado de fechas  (ej: "1/8","2/8",...)
  // Filas siguientes: turno + asignaciones
  if (!rows || rows.length < 2) return null;
  return rows;
}

// ── NOTAS DE SOCIOS (localStorage por socio+fecha) ───────────────────────────
const NOTAS_KEY = "sfly_malla_notas_v1";
function loadNotas() {
  try { return JSON.parse(localStorage.getItem(NOTAS_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveNotas(n) {
  try { localStorage.setItem(NOTAS_KEY, JSON.stringify(n)); } catch(e) {}
}

function MallaTab({ mesId, store }) {
  const [notas,       setNotas]       = useState(loadNotas);
  const [editNota,    setEditNota]    = useState(null);
  const [asesorVista, setAsesorVista] = useState(null); // null = vista equipo, string = vista personal

  const malla    = MALLA_POR_MES[mesId] || null;
  const mesNum   = parseInt(mesId.split("-")[0] === "2026" ? mesId.split("-")[1] : mesId.split("-")[1]);
  const year     = parseInt(mesId.split("-")[0]);
  const mesLabel = MESES_ES[mesNum-1];

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function getAsign(turno, dayNum) {
    try { return (turno && turno.dias && turno.dias[String(dayNum)]) || ""; } catch(e){ return ""; }
  }
  function getDow(d) { return (new Date(year, mesNum-1, d)).getDay(); } // 0=Dom,6=Sáb
  const isWeekend = d => { const dow=getDow(d); return dow===0||dow===6; };
  const isSab     = d => getDow(d)===6;
  const isDom     = d => getDow(d)===0;
  const daysInMonth = new Date(year, mesNum, 0).getDate();

  // Semanas Lun→Dom
  const semanas = useMemo(function(){
    if (!malla) return [];
    const weeks=[], allDays=[];
    for(let d=1;d<=daysInMonth;d++) allDays.push(d);
    let week=[];
    // find first Monday
    const firstDay = new Date(year,mesNum-1,1).getDay(); // 0=Dom
    // pad to Monday start
    const padStart = firstDay===0?6:firstDay-1; // days before first Monday
    for(let i=0;i<padStart;i++) week.push(null);
    for(let d=1;d<=daysInMonth;d++){
      week.push(d);
      const dow=getDow(d);
      if(dow===0||d===daysInMonth){ // domingo o último día
        while(week.length<7) week.push(null);
        weeks.push([...week]); week=[];
      }
    }
    return weeks;
  },[malla,mesId]);

  // Turnos principales (sin breaks)
  const TURNOS_PRINCIPALES = malla ? malla.turnos.filter(t=>["1","2","3"].includes(t.id)) : [];
  // Turno labels correctos
  const TURNO_META = {"1":{label:"Turno 1",h:"08:00–16:00",c:"#2563eb"},"2":{label:"Turno 2",h:"10:00–18:00",c:"#0f766e"},"3":{label:"Turno 3",h:"14:00–22:00",c:"#7c3aed"}};

  // Get turno of an agent on a day
  function getTurnoAgente(agente, dayNum){
    if(!malla) return null;
    for(const t of TURNOS_PRINCIPALES){
      const a=getAsign(t,dayNum);
      if(a===agente) return t;
    }
    // Check FDS turnos
    for(const t of malla.turnos.filter(t=>["5","6"].includes(t.id))){
      const a=getAsign(t,dayNum);
      if(a===agente) return t;
    }
    return null;
  }

  // Notas
  function notaKey(socio,dayNum){ return `${mesId}|${socio}|${dayNum}`; }
  function saveNota(key,val){ const n={...notas,[key]:val}; setNotas(n); saveNotas(n); }

  // Colors
  const AGENTE_COLORS={"Guillermo González":"#2563eb","Wilmary Antolinez":"#be185d","Daniel Romero":"#0f766e","Jhojan Torres":"#b45309","Wilker Casadiego":"#0891b2","Otoniel Martell":"#7c3aed","Ricardo Torres":"#059669","Bot Madruga":"#475569"};
  const DOW = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

  function AgenteBadge({name, size="md", onClick, active}){
    if(!name||name==="N/A"||name==="") return <span style={{color:"#cbd5e1",fontSize:11}}>—</span>;
    if(name==="Bot Madruga") return <span style={{fontSize:10,color:"#94a3b8"}}>🤖 Bot</span>;
    const c=AGENTE_COLORS[name]||"#6366f1";
    const isSocio=MALLA_SOCIOS.includes(name);
    const firstName=name.split(" ")[0];
    const sz=size==="sm"?{fs:10,pad:"2px 6px",av:14}:{fs:11,pad:"3px 9px",av:18};
    return (
      <span onClick={onClick} style={{display:"inline-flex",alignItems:"center",gap:4,
        background:active?c:c+"18",border:"1.5px solid "+c+(active?"":"44"),borderRadius:20,
        padding:sz.pad,fontSize:sz.fs,fontWeight:700,color:active?"#fff":c,
        cursor:onClick?"pointer":"default",transition:"all .15s",whiteSpace:"nowrap"}}>
        <span style={{width:sz.av,height:sz.av,borderRadius:"50%",
          background:active?"rgba(255,255,255,0.3)":c,
          display:"inline-flex",alignItems:"center",justifyContent:"center",
          fontSize:sz.av-8,color:"#fff",fontWeight:800,flexShrink:0}}>
          {name[0]}
        </span>
        {firstName}
        {isSocio&&<span style={{fontSize:9,opacity:0.8}}>·socio</span>}
      </span>
    );
  }

  function TurnoBadge({turno}){
    if(!turno) return <span style={{fontSize:10,color:"#e2e8f0",fontWeight:600}}>libre</span>;
    const m=TURNO_META[turno.id]||{label:"T"+turno.id,h:turno.horario,c:"#64748b"};
    return (
      <span style={{display:"inline-flex",flexDirection:"column",alignItems:"center",
        background:m.c+"15",border:"1px solid "+m.c+"44",borderRadius:8,
        padding:"4px 8px",gap:1}}>
        <span style={{fontSize:11,fontWeight:800,color:m.c}}>{m.label}</span>
        <span style={{fontSize:9,color:m.c+"cc",fontWeight:600}}>{m.h}</span>
      </span>
    );
  }

  // ── VISTA PERSONAL (clic en agente) ──────────────────────────────────────────
  function VistaPersonal({agente}){
    const c=AGENTE_COLORS[agente]||"#6366f1";
    const firstName=agente.split(" ")[0];
    let libres=0, trabajados=0, descansosDias=[];

    // Descansos del mes
    if(malla&&malla.descansos){
      const d=malla.descansos.find(d=>d.agente===agente);
      if(d) descansosDias=d.dias||[];
    }

    const semanaRows = semanas.map(function(week,wi){
      const realDays=week.filter(Boolean);
      const wkDays=realDays.filter(d=>!isWeekend(d));
      const wkndDays=realDays.filter(d=>isWeekend(d));

      // Contar fines de semana
      wkndDays.forEach(d=>{
        const t=getTurnoAgente(agente,d);
        if(t||descansosDias.includes(d)===false) trabajados++;
        else libres++;
      });

      return (
        <div key={wi} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,overflow:"hidden",marginBottom:10}}>
          {/* Header semana */}
          <div style={{background:c+"0f",borderBottom:"1px solid "+c+"22",
            padding:"8px 16px",display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:12,fontWeight:800,color:c}}>Semana {wi+1}</span>
            <span style={{fontSize:11,color:"#94a3b8"}}>
              {realDays[0]&&DOW[getDow(realDays[0])]+" "+realDays[0]} – {realDays[realDays.length-1]&&DOW[getDow(realDays[realDays.length-1])]+" "+realDays[realDays.length-1]}
            </span>
          </div>
          {/* Días Lun-Vie */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,padding:"12px 14px"}}>
            {week.filter(d=>d&&!isWeekend(d)).map(function(d){
              const t=getTurnoAgente(agente,d);
              const desc=descansosDias.includes(d);
              return (
                <div key={d} style={{textAlign:"center",background:desc?"#f0fdf4":t?TURNO_META[t.id]?.c+"0a"||"#f8fafc":"#f8fafc",
                  border:"1px solid "+(desc?"#bbf7d0":t?TURNO_META[t.id]?.c+"33"||"#e2e8f0":"#e2e8f0"),
                  borderRadius:10,padding:"8px 6px"}}>
                  <div style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>{DOW[getDow(d)]}</div>
                  <div style={{fontSize:16,fontWeight:800,color:desc?"#059669":t?TURNO_META[t.id]?.c||c:"#1e293b",margin:"4px 0"}}>{d}</div>
                  {desc?(
                    <span style={{fontSize:9,fontWeight:700,color:"#059669",background:"#dcfce7",borderRadius:6,padding:"2px 6px"}}>🏖 Libre</span>
                  ):t?(
                    <TurnoBadge turno={t}/>
                  ):(
                    <span style={{fontSize:10,color:"#94a3b8"}}>—</span>
                  )}
                </div>
              );
            })}
          </div>
          {/* Fin de semana */}
          {wkndDays.length>0&&(
            <div style={{borderTop:"1px solid #fecdd3",background:"#fff1f2",
              padding:"10px 14px",display:"flex",gap:10,flexWrap:"wrap"}}>
              <span style={{fontSize:10,fontWeight:700,color:"#be185d",
                textTransform:"uppercase",alignSelf:"center"}}>🏖 Fin de semana:</span>
              {wkndDays.map(function(d){
                const t=getTurnoAgente(agente,d);
                const desc=descansosDias.includes(d);
                return (
                  <div key={d} style={{display:"flex",alignItems:"center",gap:6,
                    background:desc||!t?"#dcfce7":"#fff",border:"1px solid "+(desc||!t?"#bbf7d0":"#fecdd3"),
                    borderRadius:10,padding:"6px 12px"}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#64748b"}}>{DOW[getDow(d)]} {d}</span>
                    {desc||!t?(
                      <span style={{fontSize:10,fontWeight:800,color:"#059669"}}>🟢 LIBRE</span>
                    ):(
                      <TurnoBadge turno={t}/>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    });

    // Resumen mes
    const fdsTotal = Array.from({length:daysInMonth},(_,i)=>i+1).filter(d=>isWeekend(d)).length;
    const fdsLibres= Array.from({length:daysInMonth},(_,i)=>i+1).filter(d=>isWeekend(d)&&!getTurnoAgente(agente,d)).length;
    const fdsTrab  = fdsTotal-fdsLibres;

    return (
      <div>
        {/* Header personal */}
        <div style={{background:"linear-gradient(135deg,"+c+","+c+"cc)",borderRadius:14,
          padding:"16px 20px",marginBottom:14,display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:48,height:48,borderRadius:"50%",background:"rgba(255,255,255,0.25)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:800,color:"#fff"}}>
            {agente[0]}
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:16,fontWeight:800,color:"#fff"}}>{agente} — {mesLabel}</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.8)",marginTop:2}}>
              Mis turnos y descansos del mes
            </div>
          </div>
          <div style={{display:"flex",gap:12,textAlign:"center"}}>
            <div style={{background:"rgba(255,255,255,0.2)",borderRadius:10,padding:"8px 14px"}}>
              <div style={{fontSize:18,fontWeight:800,color:"#fff"}}>{fdsLibres}</div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.8)",fontWeight:700}}>FDS libres</div>
            </div>
            <div style={{background:"rgba(255,255,255,0.2)",borderRadius:10,padding:"8px 14px"}}>
              <div style={{fontSize:18,fontWeight:800,color:"#fff"}}>{fdsTrab}</div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.8)",fontWeight:700}}>FDS trabaja</div>
            </div>
            <div style={{background:"rgba(255,255,255,0.2)",borderRadius:10,padding:"8px 14px"}}>
              <div style={{fontSize:18,fontWeight:800,color:"#fff"}}>{descansosDias.length}</div>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.8)",fontWeight:700}}>días libre</div>
            </div>
          </div>
        </div>
        {/* Aviso breaks */}
        <div style={{background:"#fffbeb",border:"1px solid #fbbf24",borderRadius:10,
          padding:"10px 16px",marginBottom:14,fontSize:12,color:"#92400e",fontWeight:600,
          display:"flex",alignItems:"center",gap:8}}>
          ☕ <strong>Breaks:</strong> Coordinalos con el equipo. No pueden salir dos personas al mismo tiempo al break ni al baño — siempre debe haber alguien disponible en Easydial y chat.
        </div>
        {/* Semanas */}
        {semanaRows}
      </div>
    );
  }

  // ── VISTA EQUIPO (tabla simplificada) ────────────────────────────────────────
  function VistaEquipo(){
    if(!malla) return (
      <div style={{textAlign:"center",padding:48,background:"#fff",borderRadius:14,
        border:"1.5px dashed #e2e8f0",color:"#94a3b8"}}>
        <div style={{fontSize:28,marginBottom:8}}>📭</div>
        <div style={{fontWeight:700,fontSize:14}}>No hay malla cargada para {mesLabel}</div>
        <div style={{fontSize:12,marginTop:6}}>Disponible desde Agosto 2026.</div>
      </div>
    );

    return (
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {/* Aviso breaks */}
        <div style={{background:"#fffbeb",border:"1px solid #fbbf24",borderRadius:10,
          padding:"10px 16px",fontSize:12,color:"#92400e",fontWeight:600,
          display:"flex",alignItems:"center",gap:8}}>
          ☕ <strong>Regla de breaks:</strong> No pueden salir dos personas al mismo tiempo al break ni al auxiliar. Coordinalos entre el equipo para que siempre haya cobertura en Easydial y chat.
        </div>

        {semanas.map(function(week,wi){
          const realDays=week.filter(Boolean);
          if(!realDays.length) return null;
          const wkndDays=realDays.filter(d=>isWeekend(d));

          return (
            <div key={wi} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,overflow:"hidden"}}>
              {/* Header */}
              <div style={{background:"#f8fafc",borderBottom:"1px solid #e2e8f0",
                padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:12,fontWeight:800,color:"#6d28d9"}}>Semana {wi+1}</span>
                <span style={{fontSize:11,color:"#94a3b8"}}>
                  {realDays.filter(d=>!isWeekend(d)).length} días hábiles
                  {wkndDays.length>0&&" · "+wkndDays.length+" fin de semana"}
                </span>
                {wkndDays.length>0&&(
                  <span style={{marginLeft:"auto",background:"#fef3c7",border:"1px solid #fbbf24",
                    borderRadius:20,padding:"2px 10px",fontSize:10,fontWeight:700,color:"#b45309"}}>
                    🏖 FDS incluido
                  </span>
                )}
              </div>

              {/* Días como columnas */}
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",minWidth:500}}>
                  <thead>
                    <tr style={{background:"#f8fafc"}}>
                      <th style={{padding:"8px 14px",fontSize:11,fontWeight:700,color:"#94a3b8",
                        textAlign:"left",borderBottom:"1px solid #e2e8f0",width:110}}>Turno</th>
                      {week.map(function(d,di){
                        if(d===null) return <th key={di} style={{borderBottom:"1px solid #e2e8f0",width:60}}/>;
                        const wknd=isWeekend(d), dow=getDow(d);
                        return (
                          <th key={di} style={{padding:"6px 8px",fontSize:11,fontWeight:700,
                            color:wknd?"#be185d":"#475569",textAlign:"center",
                            borderBottom:"1px solid #e2e8f0",minWidth:70,
                            background:wknd?"#fff1f2":"transparent"}}>
                            <div>{DOW[dow]}</div>
                            <div style={{fontSize:14,color:wknd?"#be185d":"#1e293b",fontWeight:800}}>{d}</div>
                          </th>
                        );
                      })}
                    </tr>
                  </thead>
                  <tbody>
                    {TURNOS_PRINCIPALES.map(function(turno,ti){
                      const m=TURNO_META[turno.id]||{label:"T"+turno.id,h:turno.horario,c:"#64748b"};
                      return (
                        <tr key={ti} style={{borderBottom:"1px solid #f1f5f9"}}>
                          <td style={{padding:"8px 14px",borderRight:"1px solid #f1f5f9"}}>
                            <div style={{fontSize:11,fontWeight:800,color:m.c}}>{m.label}</div>
                            <div style={{fontSize:10,color:"#94a3b8"}}>{m.h}</div>
                          </td>
                          {week.map(function(d,di){
                            if(d===null) return <td key={di}/>;
                            const asign=getAsign(turno,d);
                            const wknd=isWeekend(d);
                            return (
                              <td key={di} style={{padding:"6px 8px",textAlign:"center",
                                background:wknd?"#fff8f8":"transparent"}}>
                                <AgenteBadge name={asign} size="sm"
                                  onClick={asign&&asign!=="N/A"?()=>setAsesorVista(asign):null}/>
                              </td>
                            );
                          })}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              {/* Fin de semana socios + notas */}
              {wkndDays.length>0&&(()=>{
                const socios=[];
                wkndDays.forEach(d=>{
                  malla.turnos.filter(t=>["5","6"].includes(t.id)).forEach(t=>{
                    const a=getAsign(t,d);
                    if(a&&a!=="N/A"&&a!=="") socios.push({socio:a,d,t});
                  });
                });
                if(!socios.length) return null;
                return (
                  <div style={{borderTop:"1px solid #fecdd3",background:"#fff1f2",padding:"12px 16px"}}>
                    <div style={{fontSize:11,fontWeight:800,color:"#be185d",marginBottom:10,
                      textTransform:"uppercase",letterSpacing:"0.06em"}}>
                      📋 Socios FDS · Notas de turno
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:8}}>
                      {socios.map(function({socio,d,t}){
                        const key=notaKey(socio,d);
                        const nota=notas[key]||"";
                        const isEditing=editNota&&editNota.key===key;
                        return (
                          <div key={key} style={{background:"#fff",border:"1px solid #fecdd3",
                            borderRadius:10,padding:"10px 12px"}}>
                            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                              <AgenteBadge name={socio} size="sm"/>
                              <span style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>
                                {DOW[getDow(d)]} {d}/{mesNum} · {t.horario}
                              </span>
                            </div>
                            {isEditing?(
                              <div>
                                <textarea autoFocus defaultValue={editNota.value}
                                  onChange={e=>setEditNota({...editNota,value:e.target.value})}
                                  rows={3} placeholder="Pendientes, promesas, novedades..."
                                  style={{width:"100%",border:"1.5px solid #6d28d9",borderRadius:8,
                                    padding:"6px 10px",fontSize:12,fontFamily:"'Sora',sans-serif",
                                    resize:"vertical",outline:"none"}}/>
                                <div style={{display:"flex",gap:6,marginTop:6}}>
                                  <button onClick={()=>{saveNota(key,editNota.value);setEditNota(null);}}
                                    style={{flex:1,height:30,borderRadius:8,border:"none",
                                      background:"#6d28d9",color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}}>
                                    ✅ Guardar
                                  </button>
                                  <button onClick={()=>setEditNota(null)}
                                    style={{height:30,padding:"0 10px",borderRadius:8,
                                      border:"1px solid #e2e8f0",background:"#f8fafc",
                                      color:"#64748b",fontWeight:700,fontSize:11,cursor:"pointer"}}>✕</button>
                                </div>
                              </div>
                            ):(
                              <div onClick={()=>setEditNota({key,value:nota})}
                                style={{minHeight:36,padding:"6px 8px",borderRadius:8,
                                  border:"1.5px dashed #e2e8f0",background:"#f8fafc",
                                  fontSize:12,color:nota?"#1e293b":"#94a3b8",cursor:"pointer",lineHeight:1.5}}>
                                {nota||"Tocá para agregar notas del turno..."}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}
            </div>
          );
        })}
      </div>
    );
  }

  // ── RENDER ───────────────────────────────────────────────────────────────────
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#3b0764,#6d28d9)",borderRadius:14,
        padding:"16px 22px",display:"flex",alignItems:"center",gap:14}}>
        <div style={{fontSize:28}}>📅</div>
        <div style={{flex:1}}>
          <div style={{fontSize:16,fontWeight:800,color:"#fff"}}>
            Malla SegurosFly — {mesLabel}
            {asesorVista&&<span style={{fontSize:13,opacity:0.8}}> · {asesorVista.split(" ")[0]}</span>}
          </div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.7)",marginTop:2}}>
            {asesorVista?"Vista personal — tocá tu nombre para volver al equipo":"Tocá un nombre para ver tu malla personal"}

const TOSSPILE_KEY = "sfly_tosspile_v1";
const TOSSPILE_PIN = "2024";
const REVIEW_VALUE = 1;

// ── Tosspile — carga desde Sheets (compartido entre todos) con fallback a localStorage
function loadTosspile() {
  try { return JSON.parse(localStorage.getItem(TOSSPILE_KEY)) || []; }
  catch(e) { return []; }
}
function saveTosspile(data) {
  try { localStorage.setItem(TOSSPILE_KEY, JSON.stringify(data)); } catch(e) {}
}

// Sync Trustpilot reviews to Google Sheets (pestaña "Reseñas")
async function syncReviewToSheets(review, action) {
  try {
    const params = new URLSearchParams({
      accion: action==="delete" ? "delete_review" : "save_review",
      sheet: "Resenas",
      reviewId: review.id,
      fecha:    review.fecha,
      email:    review.email,
      asesor:   review.asesor,
      estrellas: String(review.estrellas||5),
      valor:    String(REVIEW_VALUE),
      nota:     action==="delete" ? "eliminado" : ""
    });
    await fetch(SHEETS_URL+"?"+params.toString(), { method:"GET", mode:"no-cors" });
  } catch(e) {}
}

// Carga reseñas desde Sheets al arrancar el tab
async function fetchReviewsFromSheets(setReviews) {
  try {
    const res = await fetch(SHEETS_URL+"?accion=read&sheet=Resenas", { method:"GET", cache:"no-store" });
    const data = await res.json();
    if (data && data.ok && Array.isArray(data.rows) && data.rows.length > 0) {
      const mapped = data.rows
        .filter(r => r.nota !== "eliminado" && r.reviewId)
        .map(r => ({
          id:        String(r.reviewId||r.orden||Date.now()),
          fecha:     String(r.fecha||"").slice(0,10),
          email:     String(r.asesor2||r.nota||r.mes||""),
          asesor:    String(r.asesor||"guillermo").toLowerCase().trim(),
          estrellas: parseInt(r.dia||r.valorUsd||5)||5,
          valor:     REVIEW_VALUE,
        }));
      if (mapped.length > 0) {
        saveTosspile(mapped);
        setReviews(mapped);
      }
    }
  } catch(e) {}
}

  const [reviews, setReviews] = useState(loadTosspile);
  const [form, setForm]       = useState({ fecha: new Date().toISOString().slice(0,10), email:"", asesor: "guillermo", estrellas: 5 });
  const [editId, setEditId]   = useState(null);
  const [delId, setDelId]     = useState(null);
  const [delPin, setDelPin]   = useState("");
  const [delErr, setDelErr]   = useState(false);
  const [saved, setSaved]     = useState(false);
  const [filterAsesor, setFilterAsesor] = useState("todos");

  const persist = (data, lastReview=null, action="save") => { saveTosspile(data); setReviews(data); if(lastReview) syncReviewToSheets(lastReview, action); };

  // Cargar desde Sheets al montar (compartido entre todos los asesores)
  useEffect(function(){ fetchReviewsFromSheets(setReviews); }, []);
  const visibles = reviews.filter(r => !r.deleted);

  const TP_ASESORES = ["guillermo","daniel","wilmary"]; // Asesores activos en Trustpilot — editar aquí para agregar más
  const COLOR = { guillermo:"#2563eb", carolina:"#7c3aed", daniel:"#0f766e", wilmary:"#be185d" };
  const nombreAsesor = (a) => { const names={guillermo:"Guillermo",carolina:"Carolina",daniel:"Daniel R.",wilmary:"Wilmary"}; return names[a]||( a?a[0].toUpperCase()+a.slice(1):a); };

  const totales = TP_ASESORES.reduce((acc, a) => {
    acc[a] = visibles.filter(r => r.asesor===a).length * REVIEW_VALUE;
    return acc;
  }, {});
  const totalGeneral = visibles.length * REVIEW_VALUE;
  const avgScore = visibles.length>0 ? visibles.reduce((s,r)=>s+(r.estrellas||5),0)/visibles.length : 5;

  const distrib = {5:0,4:0,3:0,2:0,1:0};
  visibles.forEach(r=>{ const s=r.estrellas||5; distrib[s]=(distrib[s]||0)+1; });

  // Gráfica: reviews por día de la semana
  const DOW_ESP = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const reviewsByDow = [0,1,2,3,4,5,6].map(dow => ({
    dow, label: DOW_ESP[dow],
    count: visibles.filter(r => {
      try { return new Date(r.fecha+"T12:00:00").getDay()===dow; } catch(e){ return false; }
    }).length
  }));
  const maxDow = Math.max(...reviewsByDow.map(d=>d.count), 1);
  const topDow = reviewsByDow.reduce((a,b)=>b.count>a.count?b:a, reviewsByDow[0]);

  // Reviews filtradas para la lista
  const reviewsFiltradas = visibles.filter(r => filterAsesor==="todos" || r.asesor===filterAsesor);

  const handleSave = () => {
    if (!form.email || !form.fecha || !form.asesor) return;
    let updated;
    if (editId) {
      updated = reviews.map(r => r.id===editId ? {...r,...form} : r);
      setEditId(null);
    } else {
      updated = [{ id:Date.now().toString(), ...form, valor:REVIEW_VALUE }, ...reviews];
    }
    const lastRev = editId ? updated.find(r=>r.id===editId) : updated[0];
    persist(updated, lastRev, "save");
    setForm({ fecha: new Date().toISOString().slice(0,10), email:"", asesor: TP_ASESORES[0] });
    setSaved(true); setTimeout(()=>setSaved(false), 2000);
  };

  const handleEdit = (r) => {
    setForm({ fecha:r.fecha, email:r.email, asesor:r.asesor, estrellas:r.estrellas||5 });
    setEditId(r.id);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const handleDelConfirm = () => {
    if (delPin===TOSSPILE_PIN) {
      const deletedRev = reviews.find(r=>r.id===delId);
      persist(reviews.filter(r=>r.id!==delId), deletedRev, "delete");
      setDelId(null); setDelPin(""); setDelErr(false);
    } else {
      setDelErr(true); setDelPin("");
    }
  };

  const inputStyle = { height:40, border:"1.5px solid #e5e7eb", borderRadius:10, padding:"0 12px",
    fontSize:14, color:"#1a1a2e", background:"#fff", outline:"none", width:"100%",
    fontFamily:"'Sora',sans-serif", fontWeight:600 };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>

      {/* ── HEADER TRUSTPILOT ── */}
      <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:16,padding:"24px",
        boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
        <div style={{display:"flex",flexWrap:"wrap",gap:24,alignItems:"center",justifyContent:"space-between"}}>
          {/* Score central */}
          <TpScoreBadge score={avgScore} total={visibles.length}/>

          {/* Barras de distribución */}
          <div style={{flex:1,minWidth:200,display:"flex",flexDirection:"column",gap:6}}>
            {[5,4,3,2,1].map(s=>(
              <TpRatingBar key={s} star={s} count={distrib[s]||0} total={visibles.length}/>
            ))}
          </div>

          {/* Cards por asesor */}
          <div style={{display:"flex",flexDirection:"column",gap:8,minWidth:160}}>
            {TP_ASESORES.map(a=>(
              <div key={a} style={{display:"flex",alignItems:"center",gap:10,
                background:(COLOR[a]||"#6366f1")+"0a",borderRadius:10,padding:"8px 12px",
                border:"1px solid "+(COLOR[a]||"#6366f1")+"22"}}>
                <div style={{width:28,height:28,borderRadius:"50%",background:COLOR[a]||"#6366f1",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:12,fontWeight:800,color:"#fff",flexShrink:0}}>
                  {a[0].toUpperCase()}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#374151"}}>{nombreAsesor(a)}</div>
                  <div style={{display:"flex",gap:2,marginTop:1}}>
                    {[1,2,3,4,5].map(i=><TpStar key={i} filled size={10}/>)}
                    <span style={{fontSize:10,color:"#6b7280",marginLeft:3}}>{totales[a]||0} reseñas</span>
                  </div>
                </div>
                <div style={{fontSize:16,fontWeight:800,color:COLOR[a]||"#6366f1"}}>${totales[a]||0}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Link a Trustpilot real */}
        <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid #f3f4f6",
          display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <TpStars n={5} size={16}/>
            <span style={{fontSize:12,color:"#6b7280"}}>{totalGeneral} reseñas registradas</span>
          </div>
          <a href="https://www.trustpilot.com/review/segurosfly.com" target="_blank" rel="noopener noreferrer"
            style={{display:"flex",alignItems:"center",gap:6,background:"#00b67a",color:"#fff",
              padding:"7px 14px",borderRadius:8,fontSize:12,fontWeight:700,textDecoration:"none"}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/>
            </svg>
            Ver en Trustpilot
          </a>
        </div>
      </div>

      {/* ── GRÁFICA DÍAS CON MÁS REVIEWS ── */}
      <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:16,padding:"20px 22px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div>
            <div style={{fontSize:14,fontWeight:800,color:"#1a1a2e"}}>📊 Reviews por día de la semana</div>
            <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>
              {totalGeneral>0 ? <>El mejor día es <strong style={{color:"#00b67a"}}>{topDow.label}</strong> con {topDow.count} reseña{topDow.count!==1?"s":""}</> : "Sin datos aún"}
            </div>
          </div>
          <div style={{background:"#00b67a15",border:"1px solid #00b67a33",borderRadius:8,
            padding:"6px 12px",fontSize:11,fontWeight:700,color:"#00b67a"}}>
            Total: {totalGeneral}
          </div>
        </div>
        <svg viewBox="0 0 560 120" style={{width:"100%",height:"auto",display:"block",overflow:"visible"}}>
          <defs>
            <linearGradient id="tpGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#00b67a" stopOpacity="0.25"/>
              <stop offset="100%" stopColor="#00b67a" stopOpacity="0"/>
            </linearGradient>
          </defs>
          {(() => {
            const W=560,H=120,PL=12,PR=12,PT=28,PB=36;
            const colW=(W-PL-PR)/6;
            const pts = reviewsByDow.map((d,i)=>({
              ...d, x:PL+i*colW, y:PT+(1-(d.count/maxDow))*(H-PT-PB)
            }));
            const poly = pts.map(p=>p.x+","+p.y).join(" ");
            return (
              <g>
                {[0,0.5,1].map((t,i)=>(
                  <line key={i} x1={PL} y1={PT+(1-t)*(H-PT-PB)} x2={W-PR} y2={PT+(1-t)*(H-PT-PB)}
                    stroke="#f3f4f6" strokeWidth="1"/>
                ))}
                <polygon points={PL+","+(H-PB)+" "+poly+" "+(W-PR)+","+(H-PB)} fill="url(#tpGrad)"/>
                <polyline points={poly} fill="none" stroke="#00b67a" strokeWidth="2.5"
                  strokeLinejoin="round" strokeLinecap="round"/>
                {pts.map((p,i)=>{
                  const isTop=p.dow===topDow.dow&&totalGeneral>0&&p.count>0;
                  return (
                    <g key={i}>
                      {p.count>0&&(
                        <text x={p.x} y={p.y-10} textAnchor="middle" fontSize="9" fontWeight="700"

                      <circle cx={p.x} cy={p.y} r={isTop?6:4}
                        fill={isTop?"#00b67a":p.count>0?"#00b67a":"#e5e7eb"}
                        stroke="#fff" strokeWidth="2"/>
                      <text x={p.x} y={H-PB+15} textAnchor="middle" fontSize="10"
                        fontWeight={isTop?"800":"600"} fill={isTop?"#00b67a":"#6b7280"}
                        fontFamily="Sora,sans-serif">{p.label}</text>
                    </g>
                  );
                })}
              </g>
            );
          })()}
        </svg>
      </div>

      {/* ── FORMULARIO ESTILO TP ── */}
      <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:16,padding:"20px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>

            {editId?"✏️ Editando reseña":"Registrar nueva reseña"}

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr auto",gap:10,alignItems:"end"}} className="mob-form">

          </div>
          <div>
            <div style={{fontSize:10,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:5}}>📧 Correo del cliente</div>
            <input type="email" placeholder="cliente@email.com" value={form.email}
              onChange={e=>setForm({...form,email:e.target.value})}
              onKeyDown={e=>e.key==="Enter"&&handleSave()} style={inputStyle}/>
          </div>
          <div>
            <div style={{fontSize:10,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:5}}>👤 Asesor</div>
            <select value={form.asesor} onChange={e=>setForm({...form,asesor:e.target.value})}
              style={{...inputStyle,background:"#f9fafb"}}>
              {TP_ASESORES.map(a=><option key={a} value={a}>{nombreAsesor(a)}</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:10,color:"#6b7280",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:5}}>⭐ Calificación</div>
            <div style={{display:"flex",gap:4,height:40,alignItems:"center",background:"#f9fafb",
              border:"1.5px solid #e5e7eb",borderRadius:10,padding:"0 12px"}}>
              {[1,2,3,4,5].map(n=>(
                <span key={n} onClick={()=>setForm({...form,estrellas:n})}
                  style={{cursor:"pointer",fontSize:22,lineHeight:1,
                    filter:n<=form.estrellas?"none":"grayscale(1) opacity(0.35)",
                    transition:"filter .1s,transform .1s",
                    transform:n<=form.estrellas?"scale(1.15)":"scale(1)"}}>
                  ★
                </span>
              ))}
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={handleSave}
              style={{height:40,padding:"0 20px",borderRadius:10,border:"none",
                background:saved?"#10b981":editId?"#6366f1":"#00b67a",
                color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",whiteSpace:"nowrap",transition:"background .2s"}}>
              {saved?"✅ Guardado!":editId?"💾 Actualizar":"⭐ Guardar"}
            </button>
            {editId&&(
              <button onClick={()=>{setEditId(null);setForm({fecha:new Date().toISOString().slice(0,10),email:"",asesor:ASESORES[0]});}}
                style={{height:40,padding:"0 12px",borderRadius:10,border:"1.5px solid #e5e7eb",
                  background:"#f9fafb",color:"#6b7280",fontWeight:700,fontSize:12,cursor:"pointer"}}>
                ✕
              </button>
            )}
          </div>
        </div>
      </div>

      {/* ── FILTRO + LISTA DE RESEÑAS ESTILO TRUSTPILOT ── */}
      {visibles.length>0 ? (
        <div>
          {/* Filtro por asesor */}
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            {["todos",...TP_ASESORES].map(a=>(
              <button key={a} onClick={()=>setFilterAsesor(a)}
                style={{height:32,padding:"0 14px",borderRadius:20,fontWeight:700,fontSize:12,cursor:"pointer",
                  border:"1.5px solid "+(filterAsesor===a?(COLOR[a]||"#00b67a"):"#e5e7eb"),
                  background:filterAsesor===a?(COLOR[a]||"#00b67a"):"#fff",
                  color:filterAsesor===a?"#fff":(COLOR[a]||"#374151"),transition:"all .15s"}}>
                {a==="todos"?"🌐 Todos":nombreAsesor(a)+" ("+visibles.filter(r=>r.asesor===a).length+")"}
              </button>
            ))}
          </div>

          {/* Cards de reviews */}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {reviewsFiltradas.length>0 ? reviewsFiltradas.map(r=>(
              <TpReviewCard key={r.id} review={r}
                onEdit={handleEdit}
                onDelete={(id)=>{setDelId(id);setDelPin("");setDelErr(false);}}
                COLOR={COLOR} nombreAsesor={nombreAsesor}/>
            )) : (
              <div style={{textAlign:"center",padding:"30px",color:"#9ca3af",background:"#f9fafb",
                borderRadius:12,border:"1.5px dashed #e5e7eb"}}>
                Sin reseñas para {nombreAsesor(filterAsesor)}
              </div>
            )}
          </div>
        </div>
      ) : (
        <div style={{textAlign:"center",padding:"48px 20px",background:"#fff",borderRadius:16,
          border:"1.5px dashed #e5e7eb"}}>
          <TpStars n={5} size={28}/>
          <div style={{fontSize:15,fontWeight:700,color:"#374151",marginTop:12}}>Sin reseñas aún</div>
          <div style={{fontSize:13,color:"#6b7280",marginTop:6}}>Registrá la primera reseña arriba</div>
          <a href="https://www.trustpilot.com/review/segurosfly.com" target="_blank" rel="noopener noreferrer"
            style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:16,background:"#00b67a",
              color:"#fff",padding:"9px 18px",borderRadius:8,fontSize:13,fontWeight:700,textDecoration:"none"}}>
            Ver reseñas en Trustpilot ↗
          </a>
        </div>
      )}

      {/* ── MODAL ELIMINAR ── */}
      {delId&&(
        <div className="modal-overlay" onClick={()=>{setDelId(null);setDelPin("");setDelErr(false);}}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:"#fff",borderRadius:20,padding:"28px 26px",width:320,textAlign:"center",
              boxShadow:"0 24px 64px rgba(0,0,0,0.18)",animation:"fadeIn .18s ease"}}>
            <div style={{fontSize:32,marginBottom:10}}>🗑️</div>
            <div style={{fontSize:16,fontWeight:800,color:"#1a1a2e",marginBottom:6}}>Eliminar reseña</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:16}}>Ingresá el código de autorización</div>
            <input type="password" inputMode="numeric" maxLength={6} placeholder="Código"
              value={delPin} onChange={e=>{setDelPin(e.target.value);setDelErr(false);}}
              onKeyDown={e=>e.key==="Enter"&&handleDelConfirm()}
              style={{height:44,border:"2px solid "+(delErr?"#ef4444":"#e5e7eb"),borderRadius:10,
                padding:"0 14px",fontSize:16,fontWeight:700,width:"100%",textAlign:"center",
                fontFamily:"'Sora',sans-serif",marginBottom:10,outline:"none"}}/>
            {delErr&&(
              <div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:8,
                padding:"8px 12px",marginBottom:10,fontSize:12,fontWeight:700,color:"#ef4444"}}>
                ❌ Código inválido. Intentá de nuevo.
              </div>
            )}
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{setDelId(null);setDelPin("");setDelErr(false);}}
                style={{flex:1,height:40,borderRadius:10,border:"1.5px solid #e5e7eb",
                  background:"#f9fafb",color:"#6b7280",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                Cancelar
              </button>
              <button onClick={handleDelConfirm}
                style={{flex:1,height:40,borderRadius:10,border:"none",
                  background:delPin.length>0?"#ef4444":"#e5e7eb",
                  color:delPin.length>0?"#fff":"#9ca3af",
                  fontWeight:700,fontSize:13,cursor:delPin.length>0?"pointer":"default",transition:"all .2s"}}>
                Eliminar
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
